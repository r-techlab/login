<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Master - User Management</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>

<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--user">Login Master</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div id="userInfoHeader" class="user-info-header"></div>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer">
                <!-- Skeleton loader will appear here initially -->
            </div>
        </div>

        <div class="main-content">
            <div id="toastContainer"></div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by Login ID, Name, or Role..." onkeyup="filterUsers()">
                </div>
                <button class="btn btn-success" onclick="openAddUserModal()">➕ Add New User</button>
            </div>

            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading users</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📭</div>
                    <h3>No Users Found</h3>
                    <p>Start by adding your first user account.</p>
                </div>
                <table id="usersTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Login ID</th>
                            <th>User Name</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit User Modal -->
<div id="userModal" class="modal">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h2 id="modalTitle">Add New User</h2>
            <span class="close" onclick="closeUserModal()">&times;</span>
        </div>
        <form id="userForm" onsubmit="saveUser(event)">
            <div class="form-group">
                <label for="loginId">Login ID *</label>
                <input type="text" id="loginId" required maxlength="50">
            </div>
            <div class="form-group">
                <label for="userName">User Name *</label>
                <input type="text" id="userName" required maxlength="100">
            </div>
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" required minlength="4" maxlength="50">
                <small style="color: #666;">Minimum 4 characters</small>
            </div>
            <div class="form-group">
                <label for="roleId">Role *</label>
                <select id="roleId" required>
                    <option value="">-- Select Role --</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="closeUserModal()">Cancel</button>
                <button type="submit" class="btn btn-success" id="saveButton">Save User</button>
            </div>
        </form>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let allUsers = [];
let allRoles = [];
let editingUserId = null;

// Show skeleton loader immediately
showMenuSkeleton('menuContainer');

// Initialize system config with theme
initPageWithTheme('loginmaster.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        // Check if user has admin access
        const session = getSession();
        if (!session || session.roleName !== 'Admin') {
            alert('Access Denied: Only administrators can access this page.');
            window.location.href = 'home.html';
            return;
        }
        
        // Display user information in header
        renderUserInfo('userInfoHeader');
        
        // Render menu and breadcrumb (replaces skeleton)
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
        
        // Load initial data
        loadRoles();
        loadUsers();
    }
});

// Load all roles for dropdown
function loadRoles() {
    apiGetRoles(function(response) {
        if (response.status === 'success') {
            allRoles = response.roles;
            populateRoleDropdown();
        }
    });
}

// Populate role dropdown
function populateRoleDropdown() {
    const roleSelect = document.getElementById('roleId');
    roleSelect.innerHTML = '<option value="">-- Select Role --</option>';
    
    allRoles.forEach(role => {
        const option = document.createElement('option');
        option.value = role.roleId;
        option.textContent = role.roleName;
        roleSelect.appendChild(option);
    });
}

// Load all users
function loadUsers() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('usersTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    
    apiGetUsers(function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            allUsers = response.users;
            displayUsers(allUsers);
        } else {
            showMessage('Error loading users: ' + response.message, 'error');
            document.getElementById('emptyState').style.display = 'block';
        }
    });
}

// Display users in table
function displayUsers(users) {
    const tbody = document.getElementById('usersTableBody');
    tbody.innerHTML = '';
    
    if (users.length === 0) {
        document.getElementById('usersTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        return;
    }
    
    document.getElementById('usersTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    
    users.forEach(user => {
        const row = document.createElement('tr');
        
        // Get role name
        const role = allRoles.find(r => r.roleId == user.roleId);
        const roleName = role ? role.roleName : 'Unknown';
        const roleBadgeClass = roleName.toLowerCase().replace(/\s+/g, '-');
        
        row.innerHTML = `
            <td><strong>${escapeHtml(user.loginId)}</strong></td>
            <td>${escapeHtml(user.userName)}</td>
            <td><span class="badge badge-${roleBadgeClass}">${escapeHtml(roleName)}</span></td>
            <td>
                <div class="action-buttons">
                    <button class="btn btn-warning btn-small" onclick="openEditUserModal('${escapeHtml(user.loginId)}')">✏️ Edit</button>
                    <button class="btn btn-danger btn-small" onclick="deleteUser('${escapeHtml(user.loginId)}')">🗑️ Delete</button>
                </div>
            </td>
        `;
        
        tbody.appendChild(row);
    });
}

// Filter users based on search
function filterUsers() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = allUsers.filter(user => {
        const role = allRoles.find(r => r.roleId == user.roleId);
        const roleName = role ? role.roleName.toLowerCase() : '';
        
        return user.loginId.toLowerCase().includes(searchTerm) ||
               user.userName.toLowerCase().includes(searchTerm) ||
               roleName.includes(searchTerm);
    });
    
    displayUsers(filtered);
}

// Open add user modal
function openAddUserModal() {
    editingUserId = null;
    document.getElementById('modalTitle').textContent = 'Add New User';
    document.getElementById('userForm').reset();
    document.getElementById('loginId').disabled = false;
    document.getElementById('saveButton').textContent = 'Save User';
    document.getElementById('userModal').style.display = 'block';
}

// Open edit user modal
function openEditUserModal(loginId) {
    const user = allUsers.find(u => u.loginId === loginId);
    if (!user) return;
    
    editingUserId = loginId;
    document.getElementById('modalTitle').textContent = 'Edit User';
    document.getElementById('loginId').value = user.loginId;
    document.getElementById('loginId').disabled = true;
    document.getElementById('userName').value = user.userName;
    document.getElementById('password').value = user.password;
    document.getElementById('roleId').value = user.roleId;
    document.getElementById('saveButton').textContent = 'Update User';
    document.getElementById('userModal').style.display = 'block';
}

// Close user modal
function closeUserModal() {
    document.getElementById('userModal').style.display = 'none';
    document.getElementById('userForm').reset();
    editingUserId = null;
}

// Save user (add or update)
function saveUser(event) {
    event.preventDefault();
    
    const loginId = document.getElementById('loginId').value.trim();
    const userName = document.getElementById('userName').value.trim();
    const password = document.getElementById('password').value.trim();
    const roleId = document.getElementById('roleId').value;
    
    if (!loginId || !userName || !password || !roleId) {
        showMessage('Please fill in all required fields', 'error');
        return;
    }
    
    const saveButton = document.getElementById('saveButton');
    saveButton.disabled = true;
    saveButton.textContent = editingUserId ? 'Updating...' : 'Saving...';
    
    const userData = {
        loginId: loginId,
        userName: userName,
        password: password,
        roleId: roleId
    };
    
    if (editingUserId) {
        // Update existing user
        apiUpdateUser(userData, function(response) {
            saveButton.disabled = false;
            saveButton.textContent = 'Update User';
            
            if (response.status === 'success') {
                showMessage('User updated successfully!', 'success');
                closeUserModal();
                loadUsers();
            } else {
                showMessage('Error: ' + response.message, 'error');
            }
        });
    } else {
        // Create new user
        apiCreateUser(userData, function(response) {
            saveButton.disabled = false;
            saveButton.textContent = 'Save User';
            
            if (response.status === 'success') {
                showMessage('User created successfully!', 'success');
                closeUserModal();
                loadUsers();
            } else {
                showMessage('Error: ' + response.message, 'error');
            }
        });
    }
}

// Delete user
function deleteUser(loginId) {
    const user = allUsers.find(u => u.loginId === loginId);
    if (!user) return;
    
    const session = getSession();
    if (session && session.userId === loginId) {
        showMessage('Cannot delete your own account while logged in!', 'error');
        return;
    }
    
    if (!confirm(`Are you sure you want to delete user "${user.userName}" (${loginId})?\n\nThis action cannot be undone.`)) {
        return;
    }
    
    apiDeleteUser(loginId, function(response) {
        if (response.status === 'success') {
            showMessage('User deleted successfully!', 'success');
            loadUsers();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// Show message

// Escape HTML to prevent XSS

// Logout function
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('userModal');
    if (event.target === modal) {
        closeUserModal();
    }
}
</script>

</body>
</html>
