<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - Home</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>

<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--dashboard">Dashboard</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="welcome-message" id="welcomeMsg">
        Welcome, <span id="userName"></span> ! <span class="role-badge" id="roleBadge"></span>
    </div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer">
                <!-- Skeleton loader will appear here initially -->
            </div>
        </div>

        <div class="main-content">
            <div class="dashboard-section" id="dashboardSection">
                <h2>📊 Your Dashboards</h2>
                <div id="dashboardContainer">
                    <div class="dashboard-loading">Loading dashboards...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Show skeleton loader immediately
showMenuSkeleton('menuContainer');

// Initialize system config with theme
initPageWithTheme('home.html', 'companyNameSidebar');

// Protect this page using IndexedDB (fast - no server call)
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        // Load and display session information
        const session = getSession();
        
        if (session) {
            // Display user information
            document.getElementById('userName').innerText = session.userName || session.userId;
            document.getElementById('roleBadge').innerText = session.roleName || 'User';
            
            // Render the dynamic menu (replaces skeleton)
            renderMenu('menuContainer');
            
            // Load user-specific dashboards
            loadUserDashboards();
        }
    }
});

// Load and render dashboards accessible to the current user
function loadUserDashboards() {
    const container = document.getElementById('dashboardContainer');
    const section = document.getElementById('dashboardSection');
    const session = getSession();
    
    if (!session) {
        if (section) section.style.display = 'none';
        return;
    }
    
    // Try to load from IndexedDB cache first (fast - no server call)
    getDashboardsFromDB(session.userId, function(cachedDashboards) {
        if (cachedDashboards && cachedDashboards.length > 0) {
            // Use cached data - render immediately
            if (section) section.style.display = '';
            renderDashboardCards(cachedDashboards);
        } else {
            // No cache found - fetch from server
            fetchDashboardsFromServer(session.userId);
        }
    });
}

// Render dashboard cards from data
function renderDashboardCards(dashboards) {
    const container = document.getElementById('dashboardContainer');
    const section = document.getElementById('dashboardSection');
    if (section) section.style.display = '';
    var html = '<div class="dashboard-grid">';
    for (var i = 0; i < dashboards.length; i++) {
        var d = dashboards[i];
        html += '<div class="dashboard-card" onclick="openDashboard(\'' + d.code + '\')">';
        html += '<div class="card-title">' + escapeHtml(d.description) + '</div>';
        html += '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
}

// Fetch dashboards from server and cache them
function fetchDashboardsFromServer(userId) {
    const container = document.getElementById('dashboardContainer');
    const section = document.getElementById('dashboardSection');
    
    apiGetUserDashboards(function(data) {
        if (data.status === 'success' && data.dashboard && data.dashboard.length > 0) {
            // Save to IndexedDB cache for future visits
            saveDashboardsToDB(userId, data.dashboard);
            if (section) section.style.display = '';
            renderDashboardCards(data.dashboard);
        } else {
            // No dashboards - hide the entire section
            if (section) section.style.display = 'none';
            container.innerHTML = '';
        }
    });
}

// Open a specific dashboard - always fetch from server
function openDashboard(code) {
    if (code === '10001') {
        // Sales By Salesman Summary - render inline bar chart
        renderSalesmanSalesSummaryChart();
    } else if (code === '10002') {
        // Customer Sales Summary - render inline bar chart
        renderCustomerSalesSummaryChart();
    } else {
        alert('Dashboard "' + code + '" is not yet configured. Please contact administrator.');
    }
}

// Render Salesman Sales Summary bar chart (code 10001)
function renderSalesmanSalesSummaryChart() {
    var container = document.getElementById('dashboardContainer');
    container.innerHTML = '<div class="dashboard-loading">Loading Salesman Sales Summary...</div>';
    
    apiGetSalesmanSalesSummary(function(data) {
        if (data.status === 'success' && data.summary && data.summary.length > 0) {
            var html = '<div class="dashboard-section">';
            html += '<h2>📊 Sales By Salesman Summary (' + data.month + '/' + data.year + ')</h2>';
            
            // Find max value for scaling
            var maxGross = 0;
            for (var i = 0; i < data.summary.length; i++) {
                if (data.summary[i].totalGross > maxGross) {
                    maxGross = data.summary[i].totalGross;
                }
            }
            
            // Bar chart
            html += '<div style="padding: 20px 0;">';
            for (var i = 0; i < data.summary.length; i++) {
                var item = data.summary[i];
                var barWidth = (item.totalGross / maxGross) * 100;
                var barColor = 'hsl(' + (i * 40) + ', 70%, 50%)';
                
                html += '<div style="margin-bottom: 15px;">';
                html += '<div style="display: flex; justify-content: space-between; margin-bottom: 3px;">';
                html += '<span style="font-weight: bold; font-size: 13px;">' + escapeHtml(item.salesmanName) + '</span>';
                html += '<span style="font-size: 13px;">' + item.totalGross.toFixed(2) + ' (' + item.invoiceCount + ' invoices)</span>';
                html += '</div>';
                html += '<div style="background: #eee; border-radius: 4px; height: 28px; overflow: hidden;">';
                html += '<div style="height: 100%; width: ' + barWidth + '%; background: ' + barColor + '; border-radius: 4px; transition: width 0.5s; display: flex; align-items: center; padding-left: 8px; color: white; font-size: 12px; font-weight: bold; min-width: 40px;">';
                html += item.totalGross.toFixed(2);
                html += '</div>';
                html += '</div>';
                html += '</div>';
            }
            html += '</div>';
            
            // Summary table
            html += '<h3 style="margin-top: 20px;">📋 Detailed Summary</h3>';
            html += '<table style="width: 100%; border-collapse: collapse; margin-top: 10px;">';
            html += '<thead><tr style="background: #667eea; color: white;">';
            html += '<th style="padding: 8px; text-align: left;">Salesman</th>';
            html += '<th style="padding: 8px; text-align: right;">Gross Amount</th>';
            html += '<th style="padding: 8px; text-align: right;">Net Amount</th>';
            html += '<th style="padding: 8px; text-align: right;">Invoices</th>';
            html += '</tr></thead><tbody>';
            
            var totalGross = 0;
            var totalNet = 0;
            var totalInvoices = 0;
            
            for (var i = 0; i < data.summary.length; i++) {
                var item = data.summary[i];
                totalGross += item.totalGross;
                totalNet += item.totalNet;
                totalInvoices += item.invoiceCount;
                html += '<tr' + (i % 2 === 0 ? ' style="background: #f5f5f5;"' : '') + '>';
                html += '<td style="padding: 8px;">' + escapeHtml(item.salesmanName) + '</td>';
                html += '<td style="padding: 8px; text-align: right;">' + item.totalGross.toFixed(2) + '</td>';
                html += '<td style="padding: 8px; text-align: right;">' + item.totalNet.toFixed(2) + '</td>';
                html += '<td style="padding: 8px; text-align: right;">' + item.invoiceCount + '</td>';
                html += '</tr>';
            }
            
            // Total row
            html += '<tr style="background: #e8e8e8; font-weight: bold;">';
            html += '<td style="padding: 8px;">Total</td>';
            html += '<td style="padding: 8px; text-align: right;">' + totalGross.toFixed(2) + '</td>';
            html += '<td style="padding: 8px; text-align: right;">' + totalNet.toFixed(2) + '</td>';
            html += '<td style="padding: 8px; text-align: right;">' + totalInvoices + '</td>';
            html += '</tr>';
            
            html += '</tbody></table>';
            html += '</div>';
            
            // Back button
            html += '<div style="margin-top: 20px;">';
            html += '<button onclick="loadUserDashboards()" style="background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px;">← Back to Dashboards</button>';
            html += '</div>';
            
            container.innerHTML = html;
        } else {
            container.innerHTML = '<div class="dashboard-empty">No sales data available for this month.</div>';
        }
    });
}

            var totalGross = 0;

            for (var i = 0; i < data.summary.length; i++) {

                html += '<td style="padding: 8px; text-align: right;">' + item.totalGross.toFixed(2) + '</td>';
                html += '<td style="padding: 8px; text-align: right;">' + item.totalNet.toFixed(2) + '</td>';
                html += '<td style="padding: 8px; text-align: right;">' + item.invoiceCount + '</td>';
                html += '</tr>';
            }
            
            // Total row
            html += '<tr style="background: #e8e8e8; font-weight: bold;">';
            html += '<td style="padding: 8px;">Total</td>';
            html += '<td style="padding: 8px; text-align: right;">' + totalGross.toFixed(2) + '</td>';
            html += '<td style="padding: 8px; text-align: right;">' + totalNet.toFixed(2) + '</td>';
            html += '<td style="padding: 8px; text-align: right;">' + totalInvoices + '</td>';
            html += '</tr>';
            
            html += '</tbody></table>';
            html += '</div>';
            
            // Back button
            html += '<div style="margin-top: 20px;">';
            html += '<button onclick="loadUserDashboards()" style="background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px;">← Back to Dashboards</button>';
            html += '</div>';
            
            container.innerHTML = html;
        } else {
            container.innerHTML = '<div class="dashboard-empty">No customer sales data available for this month.</div>';
        }
    });
}

// Helper: escape HTML to prevent XSS (provided by systemConfig.js)
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        clearSession();
        window.location.href = 'index.html';
    }
}
</script>

</body>
</html>
