<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - Home</title>
<link rel="stylesheet" href="menu.css">

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #667eea;
    padding-bottom: 20px;
    margin-bottom: 30px;
}

h1 {
    color: #333;
    margin: 0;
}

.logout-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.logout-btn:hover {
    background: #c0392b;
}

.welcome-message {
    font-size: 24px;
    color: #667eea;
    margin-bottom: 20px;
}

.role-badge {
    display: inline-block;
    background: #3498db;
    color: white;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
}

.layout-with-sidebar {
    display: flex;
    gap: 20px;
    margin-top: 30px;
}

.sidebar {
    width: 300px;
    flex-shrink: 0;
}

.company-name-sidebar {
    font-size: 16px;
    font-weight: bold;
    color: white;
    padding: 12px;
    margin-bottom: 15px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 8px;
    text-align: center;
}

.main-content {
    flex: 1;
}

@media (max-width: 992px) {
    .layout-with-sidebar {
        flex-direction: column;
    }
    
    .sidebar {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>🏠 Dashboard</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="welcome-message" id="welcomeMsg">
        Welcome, <span id="userName"></span> ! <span class="role-badge" id="roleBadge"></span>
    </div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer">
                <!-- Skeleton loader will appear here initially -->
            </div>
        </div>

        <div class="main-content">
            <!-- Clean main content area -->
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="themeManager.js"></script>
<script>
// Show skeleton loader immediately
showMenuSkeleton('menuContainer');

// Initialize system config with theme
initPageWithTheme('home.html', 'companyNameSidebar');

// Protect this page using IndexedDB (fast - no server call)
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        // Load and display session information
        const session = getSession();
        
        if (session) {
            // Display user information
            document.getElementById('userName').innerText = session.userName || session.userId;
            document.getElementById('roleBadge').innerText = session.roleName || 'User';
            
            // Render the dynamic menu (replaces skeleton)
            renderMenu('menuContainer');
        }
    }
});

function logout() {
    if (confirm('Are you sure you want to logout?')) {
        clearSession();
        window.location.href = 'index.html';
    }
}
</script>

</body>
</html>
