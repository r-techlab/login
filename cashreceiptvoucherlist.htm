<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cash Receipt Voucher - Voucher List</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>

<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--document">Cash Receipt Voucher</h1>
        <div>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>

        <div class="main-content">
            <div id="messageContainer"></div>

            <div class="stats-card" id="statsCard" style="display: none;">
                <div class="stat-item">
                    <h3 id="totalVouchers">0</h3>
                    <p>Total Vouchers</p>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by DocNo, Narration, or Date..." onkeyup="filterVouchers()">
                </div>
                <button class="btn btn-success" onclick="createNewVoucher()">➕ Add New Voucher</button>
            </div>

            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading vouchers</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📒</div>
                    <h3>No Cash Receipt Vouchers Found</h3>
                    <p>Start by creating your first cash receipt voucher.</p>
                </div>
                <table id="jvTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Doc No</th>
                            <th>Date</th>
                            <th>Narration</th>
                            <th class="amount">Debit</th>
                            <th class="amount">Credit</th>
                            <th>Ref No</th>
                            <th>Posted</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jvTableBody">
                    </tbody>
                </table>
                <div class="pagination" id="paginationControls" style="display: none;">
                    <button class="nav-btn" onclick="goToFirstPage()" id="firstPageBtn" title="First Page">« First</button>
                    <button class="nav-btn" onclick="goToPage(currentPage - 1)" id="prevPageBtn" title="Previous Page">◀ Previous</button>
                    <div id="pageNumbers" style="display: inline-flex; gap: 3px; align-items: center;"></div>
                    <span class="page-info" id="pageInfo">Page 1 of 1</span>
                    <span class="total-records" id="totalRecords"></span>
                    <button class="nav-btn" onclick="goToPage(currentPage + 1)" id="nextPageBtn" title="Next Page">Next ▶</button>
                    <button class="nav-btn" onclick="goToLastPage()" id="lastPageBtn" title="Last Page">Last »</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let currentPage = 1;
let pageSize = 10;
let totalRecords = 0;
let totalPages = 0;
let currentSearch = '';

// Initialize system config with theme
initPageWithTheme('cashreceiptvoucherlist.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
        
        loadVouchers();
    }
});

// Load vouchers from server with pagination
function loadVouchers() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('jvTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('statsCard').style.display = 'none';
    document.getElementById('paginationControls').style.display = 'none';
    
    pageSize = parseInt(getSystemParameter('ListRowCount', '10')) || 10;
    
    apiGetCashReceiptVouchers(currentPage, pageSize, currentSearch, function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            var vouchers = response.jv || response.vouchers || [];
            totalRecords = response.totalRecords || 0;
            totalPages = response.totalPages || 0;
            
            displayVouchers(vouchers);
            updateStats();
        } else if (currentSearch) {
            showMessage('Server search unavailable, using local filter...', 'warning');
            
            apiGetCashReceiptVouchers(1, pageSize, '', function(firstResponse) {
                if (firstResponse.status === 'success') {
                    var allVouchers = firstResponse.jv || firstResponse.vouchers || [];
                    var totalServerRecords = firstResponse.totalRecords || 0;
                    var totalServerPages = firstResponse.totalPages || 1;
                    var loadedPages = 1;
                    
                    function loadNextPage() {
                        if (loadedPages >= totalServerPages) {
                            var search = currentSearch.toLowerCase();
                            var filteredVouchers = allVouchers.filter(function(v) {
                                return (v.docNo && v.docNo.toLowerCase().indexOf(search) !== -1) ||
                                       (v.narration && v.narration.toLowerCase().indexOf(search) !== -1) ||
                                       (v.date && v.date.toLowerCase().indexOf(search) !== -1);
                            });
                            
                            totalRecords = filteredVouchers.length;
                            totalPages = Math.ceil(totalRecords / pageSize) || 1;
                            
                            var startIndex = (currentPage - 1) * pageSize;
                            var endIndex = Math.min(startIndex + pageSize, totalRecords);
                            var pagedVouchers = filteredVouchers.slice(startIndex, endIndex);
                            
                            displayVouchers(pagedVouchers);
                            updateStats();
                            return;
                        }
                        
                        loadedPages++;
                        apiGetCashReceiptVouchers(loadedPages, pageSize, '', function(nextResponse) {
                            if (nextResponse.status === 'success') {
                                var nextVouchers = nextResponse.jv || nextResponse.vouchers || [];
                                nextVouchers.forEach(function(v) { allVouchers.push(v); });
                                loadNextPage();
                            } else {
                                loadNextPage();
                            }
                        });
                    }
                    
                    loadNextPage();
                } else {
                    showMessage('Error loading vouchers: ' + firstResponse.message, 'error');
                    document.getElementById('emptyState').style.display = 'block';
                }
            });
        } else {
            showMessage('Error loading vouchers: ' + response.message, 'error');
            document.getElementById('emptyState').style.display = 'block';
        }
    });
}

// Update statistics
function updateStats() {
    document.getElementById('totalVouchers').textContent = totalRecords;
    document.getElementById('statsCard').style.display = 'flex';
}

// Display vouchers in table
function displayVouchers(vouchers) {
    const tbody = document.getElementById('jvTableBody');
    tbody.innerHTML = '';
    
    if (vouchers.length === 0) {
        document.getElementById('jvTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('paginationControls').style.display = 'none';
        return;
    }
    
    document.getElementById('jvTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    
    vouchers.forEach(v => {
        const row = document.createElement('tr');
        const isPosted = v.postedBy && v.postedBy !== '';
        
        row.innerHTML = `
            <td><strong>${escapeHtml(v.docNo)}</strong></td>
            <td>${formatDate(v.date)}</td>
            <td>${escapeHtml(v.narration || '-')}</td>
            <td class="amount" style="color: #e74c3c;">${formatAmount(v.debit)}</td>
            <td class="amount" style="color: #27ae60;">${formatAmount(v.credit)}</td>
            <td>${escapeHtml(v.refNo || '-')}</td>
            <td>${isPosted ? '<span style="color: #27ae60; font-weight: bold;">✓ Posted</span>' : '<span style="color: #e74c3c;">Not Posted</span>'}</td>
            <td>
                <div class="action-buttons">
                    <button class="btn btn-small" onclick="viewVoucher('${escapeHtml(v.docNo)}')">👁️ View</button>
                    <button class="btn btn-warning btn-small" onclick="editVoucher('${escapeHtml(v.docNo)}')" ${isPosted ? 'disabled' : ''}>✏️ Edit</button>
                    <button class="btn btn-danger btn-small" onclick="deleteVoucher('${escapeHtml(v.docNo)}')" ${isPosted ? 'disabled' : ''}>🗑️ Delete</button>
                    ${isPosted 
                        ? `<button class="btn btn-warning btn-small" onclick="cancelPostVoucher('${escapeHtml(v.docNo)}')">↩ CancelPost</button>`
                        : `<button class="btn btn-success btn-small" onclick="postVoucher('${escapeHtml(v.docNo)}')">📤 Post</button>`
                    }
                </div>
            </td>
        `;
        
        tbody.appendChild(row);
    });
    
    updatePaginationControls();
}

// Update pagination controls with page number buttons
function updatePaginationControls() {
    const paginationControls = document.getElementById('paginationControls');
    const firstBtn = document.getElementById('firstPageBtn');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const lastBtn = document.getElementById('lastPageBtn');
    const pageInfo = document.getElementById('pageInfo');
    const totalRecordsSpan = document.getElementById('totalRecords');
    const pageNumbersDiv = document.getElementById('pageNumbers');
    
    paginationControls.style.display = 'flex';
    pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
    totalRecordsSpan.textContent = `(${totalRecords} records)`;
    
    firstBtn.disabled = currentPage <= 1;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
    lastBtn.disabled = currentPage >= totalPages;
    
    pageNumbersDiv.innerHTML = '';
    
    if (totalPages <= 7) {
        for (let i = 1; i <= totalPages; i++) {
            pageNumbersDiv.appendChild(createPageButton(i));
        }
    } else {
        pageNumbersDiv.appendChild(createPageButton(1));
        
        if (currentPage > 3) {
            pageNumbersDiv.appendChild(createEllipsis());
        }
        
        let startPage = Math.max(2, currentPage - 1);
        let endPage = Math.min(totalPages - 1, currentPage + 1);
        
        if (currentPage <= 3) {
            startPage = 2;
            endPage = Math.min(4, totalPages - 1);
        }
        
        if (currentPage >= totalPages - 2) {
            startPage = Math.max(2, totalPages - 3);
            endPage = totalPages - 1;
        }
        
        for (let i = startPage; i <= endPage; i++) {
            pageNumbersDiv.appendChild(createPageButton(i));
        }
        
        if (currentPage < totalPages - 2) {
            pageNumbersDiv.appendChild(createEllipsis());
        }
        
        pageNumbersDiv.appendChild(createPageButton(totalPages));
    }
}

// Create a page number button element
function createPageButton(pageNum) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (pageNum === currentPage ? ' active' : '');
    btn.textContent = pageNum;
    btn.onclick = function() { goToPage(pageNum); };
    btn.title = 'Page ' + pageNum;
    return btn;
}

// Create an ellipsis element
function createEllipsis() {
    const span = document.createElement('span');
    span.className = 'page-ellipsis';
    span.textContent = '...';
    return span;
}

// Go to a specific page
function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    if (page === currentPage) return;
    
    currentPage = page;
    loadVouchers();
}

// Go to first page
function goToFirstPage() {
    if (currentPage === 1) return;
    currentPage = 1;
    loadVouchers();
}

// Go to last page
function goToLastPage() {
    if (currentPage === totalPages) return;
    currentPage = totalPages;
    loadVouchers();
}

// Filter vouchers based on search (server-side)
function filterVouchers() {
    currentSearch = document.getElementById('searchInput').value.toLowerCase();
    currentPage = 1;
    loadVouchers();
}

// Create new voucher
function createNewVoucher() {
    window.location.href = 'cashreceiptvoucherform.htm';
}

// View voucher
function viewVoucher(docNo) {
    window.location.href = 'cashreceiptvoucherform.htm?view=' + encodeURIComponent(docNo);
}

// Edit voucher
function editVoucher(docNo) {
    window.location.href = 'cashreceiptvoucherform.htm?docno=' + encodeURIComponent(docNo);
}

// Delete voucher
function deleteVoucher(docNo) {
    let confirmMsg = `Are you sure you want to delete cash receipt voucher "${docNo}"?`;
    confirmMsg += '\n\nThis action cannot be undone.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiDeleteCashReceiptVoucher(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Cash Receipt Voucher deleted successfully!', 'success');
            loadVouchers();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// Post voucher to accounting
function postVoucher(docNo) {
    let confirmMsg = 'Are you sure you want to post cash receipt voucher "' + docNo + '" to accounting?';
    confirmMsg += '\n\nThis will create accounting entries in AccountTransaction.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiPostCRVToAccountTransaction(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Cash Receipt Voucher posted successfully!', 'success');
            loadVouchers();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// Cancel voucher post
function cancelPostVoucher(docNo) {
    let confirmMsg = 'Are you sure you want to cancel the post for cash receipt voucher "' + docNo + '"?';
    confirmMsg += '\n\nThis will delete the accounting entries.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiCancelCRVAccountTransactionPost(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Cash Receipt Voucher post cancelled successfully!', 'success');
            loadVouchers();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// Format date for display

// Format amount for display

// Show message

// Escape HTML to prevent XSS

// Logout function
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}
</script>

</body>
</html>
