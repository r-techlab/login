<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase Management - Purchase List</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--cart">Purchase Management</h1>
        <div>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>

        <div class="main-content">
            <div id="messageContainer"></div>

            <div class="stats-card" id="statsCard" style="display: none;">
                <div class="stat-item">
                    <h3 id="totalPurchases">0</h3>
                    <p>Total Purchases</p>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by DocNo, Supplier, or Date..." onkeyup="filterPurchases()">
                </div>
                <button class="btn btn-success" onclick="createNewPurchase()">➕ Add New Purchase</button>
            </div>

            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading purchases</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📦</div>
                    <h3>No Purchases Found</h3>
                    <p>Start by creating your first purchase.</p>
                </div>
                <table id="purchasesTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Doc No</th>
                            <th>Date</th>
                            <th>Supplier</th>
                            <th>Narration</th>
                            <th class="amount">Gross Amount</th>
                            <th class="amount">Net Amount</th>
                            <th>Posted</th>
                            <th>Actions</th>
                        </tr>

                    </thead>
                    <tbody id="purchasesTableBody">
                    </tbody>
                </table>
                <div class="pagination" id="paginationControls" style="display: none;">
                    <button class="nav-btn" onclick="goToFirstPage()" id="firstPageBtn" title="First Page">« First</button>
                    <button class="nav-btn" onclick="goToPage(currentPage - 1)" id="prevPageBtn" title="Previous Page">◀ Previous</button>
                    <div id="pageNumbers" style="display: inline-flex; gap: 3px; align-items: center;"></div>
                    <span class="page-info" id="pageInfo">Page 1 of 1</span>
                    <span class="total-records" id="totalRecords"></span>
                    <button class="nav-btn" onclick="goToPage(currentPage + 1)" id="nextPageBtn" title="Next Page">Next ▶</button>
                    <button class="nav-btn" onclick="goToLastPage()" id="lastPageBtn" title="Last Page">Last »</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let currentPage = 1;
let pageSize = 10;
let totalRecords = 0;
let totalPages = 0;
let currentSearch = '';

// Initialize system config with theme
initPageWithTheme('purchaselist.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
        loadPurchases();
    }
});

// Load purchases from server with pagination
function loadPurchases() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('purchasesTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('statsCard').style.display = 'none';
    document.getElementById('paginationControls').style.display = 'none';
    
    pageSize = parseInt(getSystemParameter('ListRowCount', '10')) || 10;
    
    // Try server-side search first, fall back to client-side filtering if it fails
    apiGetPurchases(currentPage, pageSize, currentSearch, function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            var purchases = response.purchases || [];
            totalRecords = response.totalRecords || 0;
            totalPages = response.totalPages || 0;
            
            displayPurchases(purchases);
            updateStats();
        } else if (currentSearch) {
            // Server-side search failed, fall back to client-side filtering
            showMessage('Server search unavailable, using local filter...', 'warning');
            apiGetPurchases(1, 99999, '', function(allResponse) {
                if (allResponse.status === 'success') {
                    var allPurchases = allResponse.purchases || [];
                    var search = currentSearch.toLowerCase();
                    
                    var filteredPurchases = allPurchases.filter(function(purchase) {
                        return (purchase.docNo && purchase.docNo.toLowerCase().indexOf(search) !== -1) ||
                               (purchase.supplier && purchase.supplier.toLowerCase().indexOf(search) !== -1) ||
                               (purchase.narration && purchase.narration.toLowerCase().indexOf(search) !== -1) ||
                               (purchase.date && purchase.date.toLowerCase().indexOf(search) !== -1);
                    });
                    
                    totalRecords = filteredPurchases.length;
                    totalPages = Math.ceil(totalRecords / pageSize);
                    
                    var startIndex = (currentPage - 1) * pageSize;
                    var endIndex = Math.min(startIndex + pageSize, totalRecords);
                    var pagedPurchases = filteredPurchases.slice(startIndex, endIndex);
                    
                    displayPurchases(pagedPurchases);
                    updateStats();
                } else {
                    showMessage('Error loading purchases: ' + allResponse.message, 'error');
                    document.getElementById('emptyState').style.display = 'block';
                }
            });
        } else {
            showMessage('Error loading purchases: ' + response.message, 'error');
            document.getElementById('emptyState').style.display = 'block';
        }
    });
}

// Update statistics
function updateStats() {
    document.getElementById('totalPurchases').textContent = totalRecords;
    document.getElementById('statsCard').style.display = 'flex';
}

// Display purchases in table
function displayPurchases(purchases) {
    const tbody = document.getElementById('purchasesTableBody');
    tbody.innerHTML = '';
    
    if (purchases.length === 0) {
        document.getElementById('purchasesTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('paginationControls').style.display = 'none';
        return;
    }
    
    document.getElementById('purchasesTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    
    purchases.forEach(function(purchase) {
        const row = document.createElement('tr');
        const isPosted = purchase.postedBy && purchase.postedBy !== '';
        
        row.innerHTML = `
            <td><strong>${escapeHtml(purchase.docNo)}</strong></td>
            <td>${formatDate(purchase.date)}</td>
            <td>${escapeHtml(purchase.supplier || '-')}</td>
            <td>${escapeHtml(purchase.narration || '-')}</td>
            <td class="amount">${formatAmount(purchase.grossAmount)}</td>
            <td class="amount">${formatAmount(purchase.net)}</td>
            <td>${isPosted ? '<span style="color: #27ae60; font-weight: bold;">✓ Posted</span>' : '<span style="color: #e74c3c;">Not Posted</span>'}</td>
            <td>
                <div class="action-buttons">
                    <button class="btn btn-small" onclick="viewPurchase('${escapeHtml(purchase.docNo)}')">👁️ View</button>
                    <button class="btn btn-warning btn-small" onclick="editPurchase('${escapeHtml(purchase.docNo)}')" ${isPosted ? 'disabled' : ''}>✏️ Edit</button>
                    <button class="btn btn-danger btn-small" onclick="deletePurchase('${escapeHtml(purchase.docNo)}')" ${isPosted ? 'disabled' : ''}>🗑️ Delete</button>
                    ${isPosted 
                        ? `<button class="btn btn-warning btn-small" onclick="cancelPostPurchase('${escapeHtml(purchase.docNo)}')">↩ CancelPost</button>`
                        : `<button class="btn btn-success btn-small" onclick="postPurchase('${escapeHtml(purchase.docNo)}')">📤 Post</button>`
                    }
                </div>
            </td>
        `;
        
        tbody.appendChild(row);
    });

    
    updatePaginationControls();
}

// Update pagination controls
function updatePaginationControls() {
    const paginationControls = document.getElementById('paginationControls');
    const firstBtn = document.getElementById('firstPageBtn');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const lastBtn = document.getElementById('lastPageBtn');
    const pageInfo = document.getElementById('pageInfo');
    const totalRecordsSpan = document.getElementById('totalRecords');
    const pageNumbersDiv = document.getElementById('pageNumbers');
    
    paginationControls.style.display = 'flex';
    pageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
    totalRecordsSpan.textContent = '(' + totalRecords + ' records)';
    
    firstBtn.disabled = currentPage <= 1;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
    lastBtn.disabled = currentPage >= totalPages;
    
    pageNumbersDiv.innerHTML = '';
    
    if (totalPages <= 7) {
        for (let i = 1; i <= totalPages; i++) {
            pageNumbersDiv.appendChild(createPageButton(i));
        }
    } else {
        pageNumbersDiv.appendChild(createPageButton(1));
        
        if (currentPage > 3) {
            pageNumbersDiv.appendChild(createEllipsis());
        }
        
        let startPage = Math.max(2, currentPage - 1);
        let endPage = Math.min(totalPages - 1, currentPage + 1);
        
        if (currentPage <= 3) {
            startPage = 2;
            endPage = Math.min(4, totalPages - 1);
        }
        
        if (currentPage >= totalPages - 2) {
            startPage = Math.max(2, totalPages - 3);
            endPage = totalPages - 1;
        }
        
        for (let i = startPage; i <= endPage; i++) {
            pageNumbersDiv.appendChild(createPageButton(i));
        }
        
        if (currentPage < totalPages - 2) {
            pageNumbersDiv.appendChild(createEllipsis());
        }
        
        pageNumbersDiv.appendChild(createPageButton(totalPages));
    }
}

function createPageButton(pageNum) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (pageNum === currentPage ? ' active' : '');
    btn.textContent = pageNum;
    btn.onclick = function() { goToPage(pageNum); };
    btn.title = 'Page ' + pageNum;
    return btn;
}

function createEllipsis() {
    const span = document.createElement('span');
    span.className = 'page-ellipsis';
    span.textContent = '...';
    return span;
}

function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    if (page === currentPage) return;
    currentPage = page;
    loadPurchases();
}

function goToFirstPage() {
    if (currentPage === 1) return;
    currentPage = 1;
    loadPurchases();
}

function goToLastPage() {
    if (currentPage === totalPages) return;
    currentPage = totalPages;
    loadPurchases();
}

function filterPurchases() {
    currentSearch = document.getElementById('searchInput').value.toLowerCase();
    currentPage = 1;
    loadPurchases();
}

function createNewPurchase() {
    window.location.href = 'purchaseform.htm';
}

function viewPurchase(docNo) {
    window.location.href = 'purchaseform.htm?view=' + encodeURIComponent(docNo);
}

function editPurchase(docNo) {
    window.location.href = 'purchaseform.htm?docno=' + encodeURIComponent(docNo);
}

function deletePurchase(docNo) {
    let confirmMsg = 'Are you sure you want to delete purchase "' + docNo + '"?';
    confirmMsg += '\n\nThis action cannot be undone.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiDeletePurchase(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Purchase deleted successfully!', 'success');
            loadPurchases();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}





function postPurchase(docNo) {
    let confirmMsg = 'Are you sure you want to post purchase "' + docNo + '" to stock?';
    confirmMsg += '\n\nThis will update stock quantities and values.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiPostPIToStockTransaction(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Purchase posted to stock successfully!', 'success');
            loadPurchases();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

function cancelPostPurchase(docNo) {
    let confirmMsg = 'Are you sure you want to cancel the post for purchase "' + docNo + '"?';
    confirmMsg += '\n\nThis will reverse the stock transaction.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiCancelPIStockTransactionPost(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Purchase post cancelled successfully!', 'success');
            loadPurchases();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}
</script>


</body>
</html>
