<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sales Management - Sales List</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>

<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--receipt">Sales Management</h1>
        <div>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>

        <div class="main-content">
            <div id="messageContainer"></div>

            <div class="stats-card" id="statsCard" style="display: none;">
                <div class="stat-item">
                    <h3 id="totalSales">0</h3>
                    <p>Total Sales</p>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by DocNo, Customer, or Date..." onkeyup="filterSales()">
                </div>
                <button class="btn btn-success" onclick="createNewSale()">➕ Add New Sale</button>
            </div>

            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading sales</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">🧾</div>
                    <h3>No Sales Found</h3>
                    <p>Start by creating your first sale.</p>
                </div>
                <table id="salesTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Doc No</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Narration</th>
                            <th class="amount">Gross Amount</th>
                            <th class="amount">Net Amount</th>
                            <th>Posted</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="salesTableBody">
                    </tbody>
                </table>
                <div class="pagination" id="paginationControls" style="display: none;">
                    <button class="nav-btn" onclick="goToFirstPage()" id="firstPageBtn" title="First Page">« First</button>
                    <button class="nav-btn" onclick="goToPage(currentPage - 1)" id="prevPageBtn" title="Previous Page">◀ Previous</button>
                    <div id="pageNumbers" style="display: inline-flex; gap: 3px; align-items: center;"></div>
                    <span class="page-info" id="pageInfo">Page 1 of 1</span>
                    <span class="total-records" id="totalRecords"></span>
                    <button class="nav-btn" onclick="goToPage(currentPage + 1)" id="nextPageBtn" title="Next Page">Next ▶</button>
                    <button class="nav-btn" onclick="goToLastPage()" id="lastPageBtn" title="Last Page">Last »</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let currentPage = 1;
let pageSize = 10; // default, will be overridden by system parameter
let totalRecords = 0;
let totalPages = 0;
let currentSearch = '';

// Initialize system config with theme
initPageWithTheme('saleslist.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        // User has permission via RoleMenuAccess
        // Render menu and breadcrumb
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
        
        // Load initial data
        loadSales();
    }
});

// Load sales from server with pagination
function loadSales() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('salesTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('statsCard').style.display = 'none';
    document.getElementById('paginationControls').style.display = 'none';
    
    // Read ListRowCount from system parameters
    pageSize = parseInt(getSystemParameter('ListRowCount', '10')) || 10;
    
    // Try server-side search first (works after Apps Script fix)
    apiGetSales(currentPage, pageSize, currentSearch, function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            var sales = response.sales || [];
            totalRecords = response.totalRecords || 0;
            totalPages = response.totalPages || 0;
            
            displaySales(sales);
            updateStats();
        } else if (currentSearch) {
            // Server-side search failed - fetch all data page by page, then filter client-side
            showMessage('Server search unavailable, using local filter...', 'warning');
            
            // First fetch page 1 with no search to get totalRecords
            apiGetSales(1, pageSize, '', function(firstResponse) {
                if (firstResponse.status === 'success') {
                    var allSales = firstResponse.sales || [];
                    var totalServerRecords = firstResponse.totalRecords || 0;
                    var totalServerPages = firstResponse.totalPages || 1;
                    var loadedPages = 1;
                    
                    // Function to collect remaining pages
                    function loadNextPage() {
                        if (loadedPages >= totalServerPages) {
                            // All pages loaded - now filter and paginate client-side
                            var search = currentSearch.toLowerCase();
                            var filteredSales = allSales.filter(function(sale) {
                                return (sale.docNo && sale.docNo.toLowerCase().indexOf(search) !== -1) ||
                                       (sale.customer && sale.customer.toLowerCase().indexOf(search) !== -1) ||
                                       (sale.narration && sale.narration.toLowerCase().indexOf(search) !== -1) ||
                                       (sale.date && sale.date.toLowerCase().indexOf(search) !== -1);
                            });
                            
                            totalRecords = filteredSales.length;
                            totalPages = Math.ceil(totalRecords / pageSize) || 1;
                            
                            var startIndex = (currentPage - 1) * pageSize;
                            var endIndex = Math.min(startIndex + pageSize, totalRecords);
                            var pagedSales = filteredSales.slice(startIndex, endIndex);
                            
                            displaySales(pagedSales);
                            updateStats();
                            return;
                        }
                        
                        loadedPages++;
                        apiGetSales(loadedPages, pageSize, '', function(nextResponse) {
                            if (nextResponse.status === 'success') {
                                var nextSales = nextResponse.sales || [];
                                nextSales.forEach(function(s) { allSales.push(s); });
                                loadNextPage();
                            } else {
                                // Even if a page fails, use what we have
                                loadNextPage();
                            }
                        });
                    }
                    
                    loadNextPage();
                } else {
                    showMessage('Error loading sales: ' + firstResponse.message, 'error');
                    document.getElementById('emptyState').style.display = 'block';
                }
            });
        } else {
            showMessage('Error loading sales: ' + response.message, 'error');
            document.getElementById('emptyState').style.display = 'block';
        }
    });
}

// Update statistics
function updateStats() {
    document.getElementById('totalSales').textContent = totalRecords;
    document.getElementById('statsCard').style.display = 'flex';
}

// Display sales in table
function displaySales(sales) {
    const tbody = document.getElementById('salesTableBody');
    tbody.innerHTML = '';
    
    if (sales.length === 0) {
        document.getElementById('salesTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('paginationControls').style.display = 'none';
        return;
    }
    
    document.getElementById('salesTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    
    // Display the server-returned records
    sales.forEach(sale => {
        const row = document.createElement('tr');
        const isPosted = sale.postedBy && sale.postedBy !== '';
        
        row.innerHTML = `
            <td><strong>${escapeHtml(sale.docNo)}</strong></td>
            <td>${formatDate(sale.date)}</td>
            <td>${escapeHtml(sale.customer || '-')}</td>
            <td>${escapeHtml(sale.narration || '-')}</td>
            <td class="amount">${formatAmount(sale.grossAmount)}</td>
            <td class="amount">${formatAmount(sale.net)}</td>
            <td>${isPosted ? '<span style="color: #27ae60; font-weight: bold;">✓ Posted</span>' : '<span style="color: #e74c3c;">Not Posted</span>'}</td>
            <td>
                <div class="action-buttons">
                    <button class="btn btn-small" onclick="viewSale('${escapeHtml(sale.docNo)}')">👁️ View</button>
                    <button class="btn btn-warning btn-small" onclick="editSale('${escapeHtml(sale.docNo)}')" ${isPosted ? 'disabled' : ''}>✏️ Edit</button>
                    <button class="btn btn-danger btn-small" onclick="deleteSale('${escapeHtml(sale.docNo)}')" ${isPosted ? 'disabled' : ''}>🗑️ Delete</button>
                    ${isPosted 
                        ? `<button class="btn btn-warning btn-small" onclick="cancelPostSale('${escapeHtml(sale.docNo)}')">↩ CancelPost</button>`
                        : `<button class="btn btn-success btn-small" onclick="postSale('${escapeHtml(sale.docNo)}')">📤 Post</button>`
                    }
                </div>
            </td>
        `;
        
        tbody.appendChild(row);
    });
    
    // Update pagination controls
    updatePaginationControls();
}

// Update pagination controls with page number buttons
function updatePaginationControls() {
    const paginationControls = document.getElementById('paginationControls');
    const firstBtn = document.getElementById('firstPageBtn');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const lastBtn = document.getElementById('lastPageBtn');
    const pageInfo = document.getElementById('pageInfo');
    const totalRecordsSpan = document.getElementById('totalRecords');
    const pageNumbersDiv = document.getElementById('pageNumbers');
    
    paginationControls.style.display = 'flex';
    pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
    totalRecordsSpan.textContent = `(${totalRecords} records)`;
    
    // Enable/disable navigation buttons
    firstBtn.disabled = currentPage <= 1;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
    lastBtn.disabled = currentPage >= totalPages;
    
    // Generate page number buttons
    pageNumbersDiv.innerHTML = '';
    
    if (totalPages <= 7) {
        // Show all page numbers
        for (let i = 1; i <= totalPages; i++) {
            pageNumbersDiv.appendChild(createPageButton(i));
        }
    } else {
        // Show sliding window of page numbers with ellipsis
        // Always show first page
        pageNumbersDiv.appendChild(createPageButton(1));
        
        if (currentPage > 3) {
            // Show ellipsis after first page
            pageNumbersDiv.appendChild(createEllipsis());
        }
        
        // Calculate range of pages to show around current page
        let startPage = Math.max(2, currentPage - 1);
        let endPage = Math.min(totalPages - 1, currentPage + 1);
        
        // Adjust if near the beginning
        if (currentPage <= 3) {
            startPage = 2;
            endPage = Math.min(4, totalPages - 1);
        }
        
        // Adjust if near the end
        if (currentPage >= totalPages - 2) {
            startPage = Math.max(2, totalPages - 3);
            endPage = totalPages - 1;
        }
        
        for (let i = startPage; i <= endPage; i++) {
            pageNumbersDiv.appendChild(createPageButton(i));
        }
        
        if (currentPage < totalPages - 2) {
            // Show ellipsis before last page
            pageNumbersDiv.appendChild(createEllipsis());
        }
        
        // Always show last page
        pageNumbersDiv.appendChild(createPageButton(totalPages));
    }
}

// Create a page number button element
function createPageButton(pageNum) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (pageNum === currentPage ? ' active' : '');
    btn.textContent = pageNum;
    btn.onclick = function() { goToPage(pageNum); };
    btn.title = 'Page ' + pageNum;
    return btn;
}

// Create an ellipsis element
function createEllipsis() {
    const span = document.createElement('span');
    span.className = 'page-ellipsis';
    span.textContent = '...';
    return span;
}

// Go to a specific page
function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    if (page === currentPage) return;
    
    currentPage = page;
    loadSales();
}

// Go to first page
function goToFirstPage() {
    if (currentPage === 1) return;
    currentPage = 1;
    loadSales();
}

// Go to last page
function goToLastPage() {
    if (currentPage === totalPages) return;
    currentPage = totalPages;
    loadSales();
}

// Filter sales based on search (server-side)
function filterSales() {
    currentSearch = document.getElementById('searchInput').value.toLowerCase();
    currentPage = 1;
    loadSales();
}

// Create new sale
function createNewSale() {
    window.location.href = 'salesform.htm';
}

// View sale
function viewSale(docNo) {
    window.location.href = 'salesform.htm?view=' + encodeURIComponent(docNo);
}

// Edit sale
function editSale(docNo) {
    window.location.href = 'salesform.htm?docno=' + encodeURIComponent(docNo);
}

// Delete sale
function deleteSale(docNo) {
    let confirmMsg = `Are you sure you want to delete sale "${docNo}"?`;
    confirmMsg += '\n\nThis action cannot be undone.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiDeleteSale(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Sale deleted successfully!', 'success');
            loadSales();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// Format date for display

// Format amount for display

// Show message

// Escape HTML to prevent XSS

// Post sale to stock transaction
function postSale(docNo) {
    let confirmMsg = 'Are you sure you want to post sale "' + docNo + '" to stock?';
    confirmMsg += '\n\nThis will update stock quantities with negative (outflow) values.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiPostSIToStockTransaction(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Sale posted to stock successfully!', 'success');
            loadSales();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// Cancel sale stock transaction post
function cancelPostSale(docNo) {
    let confirmMsg = 'Are you sure you want to cancel the post for sale "' + docNo + '"?';
    confirmMsg += '\n\nThis will reverse the stock transaction.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiCancelSIStockTransactionPost(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Sale post cancelled successfully!', 'success');
            loadSales();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// Logout function
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}
</script>

</body>
</html>
