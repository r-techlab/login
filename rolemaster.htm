<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Role Master - Role Management</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>

<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--shield">Role Master</h1>
        <div>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>

        <div class="main-content">
            <div class="stats-card" id="statsCard" style="display: none;">
                <div class="stat-item">
                    <h3 id="totalRoles">0</h3>
                    <p>Total Roles</p>
                </div>
                <div class="stat-item">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by Role ID or Name..." onkeyup="filterRoles()">
                </div>
                <button class="btn btn-success" onclick="openAddRoleModal()">➕ Add New Role</button>
            </div>

            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading roles</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">🎭</div>
                    <h3>No Roles Found</h3>
                    <p>Start by adding your first role.</p>
                </div>
                <table id="rolesTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Role ID</th>
                            <th>Role Name</th>
                            <th>Users</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rolesTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Toast notification container -->
<div id="toastContainer"></div>

<!-- Add/Edit Role Modal -->
<div id="roleModal" class="modal">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h2 id="modalTitle">Add New Role</h2>
            <span class="close" onclick="closeRoleModal()">&times;</span>
        </div>
        <form id="roleForm" onsubmit="saveRole(event)">
            <div class="form-group" id="roleIdGroup" style="display: none;">
                <label for="rolesId">Role ID</label>
                <input type="text" id="rolesId" disabled>
                <small style="color: #666;">Auto-generated</small>
            </div>
            <div class="form-group">
                <label for="rolesName">Role Name *</label>
                <input type="text" id="rolesName" required maxlength="50" placeholder="e.g., Manager, Supervisor">
            </div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="closeRoleModal()">Cancel</button>
                <button type="submit" class="btn btn-success" id="saveButton">Save Role</button>
            </div>
        </form>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let allRoles = [];
let roleUsage = {};
let editingRoleId = null;

// Initialize system config with theme
initPageWithTheme('rolemaster.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        // Check if user has admin access
        const session = getSession();
        if (!session || session.roleName !== 'Admin') {
            alert('Access Denied: Only administrators can access this page.');
            window.location.href = 'home.html';
            return;
        }
        
        // Render menu and breadcrumb
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
        
        // Load initial data
        loadRoles();
    }
});

// Load all roles
function loadRoles() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('rolesTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('statsCard').style.display = 'none';
    
    apiGetRoles(function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            allRoles = response.roles;
            loadRoleUsage();
        } else {
            showMessage('Error loading roles: ' + response.message, 'error');
            document.getElementById('emptyState').style.display = 'block';
        }
    });
}

// Load role usage statistics
function loadRoleUsage() {
    apiGetRoleUsage(function(response) {
        if (response.status === 'success') {
            roleUsage = response.usage;
            displayRoles(allRoles);
            updateStats();
        } else {
            // If usage fails, still display roles
            displayRoles(allRoles);
        }
    });
}

// Update statistics
function updateStats() {
    const totalUsers = Object.values(roleUsage).reduce((sum, count) => sum + count, 0);
    document.getElementById('totalRoles').textContent = allRoles.length;
    document.getElementById('totalUsers').textContent = totalUsers;
    document.getElementById('statsCard').style.display = 'flex';
}

// Display roles in table
function displayRoles(roles) {
    const tbody = document.getElementById('rolesTableBody');
    tbody.innerHTML = '';
    
    if (roles.length === 0) {
        document.getElementById('rolesTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        return;
    }
    
    document.getElementById('rolesTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    
    roles.forEach(role => {
        const row = document.createElement('tr');
        const userCount = roleUsage[role.roleId] || 0;
        const roleBadgeClass = role.roleName.toLowerCase().replace(/\s+/g, '-');
        
        row.innerHTML = `
            <td><strong>${escapeHtml(role.roleId)}</strong></td>
            <td><span class="badge badge-${roleBadgeClass}">${escapeHtml(role.roleName)}</span></td>
            <td>
                <span class="usage-count ${userCount > 0 ? 'has-users' : ''}">
                    👥 ${userCount} user${userCount !== 1 ? 's' : ''}
                </span>
            </td>
            <td>
                <div class="action-buttons">
                    <button class="btn btn-warning btn-small" onclick="openEditRoleModal(${role.roleId})">✏️ Edit</button>
                    <button class="btn btn-danger btn-small" onclick="deleteRole(${role.roleId})">🗑️ Delete</button>
                </div>
            </td>
        `;
        
        tbody.appendChild(row);
    });
}

// Filter roles based on search
function filterRoles() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = allRoles.filter(role => {
        return role.roleId.toString().includes(searchTerm) ||
               role.roleName.toLowerCase().includes(searchTerm);
    });
    
    displayRoles(filtered);
}

// Open add role modal
function openAddRoleModal() {
    editingRoleId = null;
    document.getElementById('modalTitle').textContent = 'Add New Role';
    document.getElementById('roleForm').reset();
    document.getElementById('roleIdGroup').style.display = 'none';
    document.getElementById('saveButton').textContent = 'Save Role';
    document.getElementById('roleModal').style.display = 'block';
}

// Open edit role modal
function openEditRoleModal(roleId) {
    const role = allRoles.find(r => r.roleId == roleId);
    if (!role) return;
    
    editingRoleId = roleId;
    document.getElementById('modalTitle').textContent = 'Edit Role';
    document.getElementById('rolesId').value = role.roleId;
    document.getElementById('rolesName').value = role.roleName;
    document.getElementById('roleIdGroup').style.display = 'block';
    document.getElementById('saveButton').textContent = 'Update Role';
    document.getElementById('roleModal').style.display = 'block';
}

// Close role modal
function closeRoleModal() {
    document.getElementById('roleModal').style.display = 'none';
    document.getElementById('roleForm').reset();
    editingRoleId = null;
}

// Save role (add or update)
function saveRole(event) {
    event.preventDefault();
    
    const rolesName = document.getElementById('rolesName').value.trim();
    
    if (!rolesName) {
        showMessage('Please enter a role name', 'error');
        return;
    }
    
    const saveButton = document.getElementById('saveButton');
    saveButton.disabled = true;
    saveButton.textContent = editingRoleId ? 'Updating...' : 'Saving...';
    
    const roleData = {
        rolesName: rolesName
    };
    
    if (editingRoleId) {
        // Update existing role
        roleData.rolesId = editingRoleId;
        apiUpdateRole(roleData, function(response) {
            saveButton.disabled = false;
            saveButton.textContent = 'Update Role';
            
            if (response.status === 'success') {
                showMessage('Role updated successfully!', 'success');
                closeRoleModal();
                loadRoles();
            } else {
                showMessage('Error: ' + response.message, 'error');
            }
        });
    } else {
        // Create new role
        apiCreateRole(roleData, function(response) {
            saveButton.disabled = false;
            saveButton.textContent = 'Save Role';
            
            if (response.status === 'success') {
                showMessage('Role created successfully!', 'success');
                closeRoleModal();
                loadRoles();
            } else {
                showMessage('Error: ' + response.message, 'error');
            }
        });
    }
}

// Delete role
function deleteRole(roleId) {
    const role = allRoles.find(r => r.roleId == roleId);
    if (!role) return;
    
    const userCount = roleUsage[roleId] || 0;
    
    let confirmMsg = `Are you sure you want to delete role "${role.roleName}" (ID: ${roleId})?`;
    
    if (userCount > 0) {
        confirmMsg += `\n\n⚠️ WARNING: This role is currently assigned to ${userCount} user${userCount !== 1 ? 's' : ''}!`;
        confirmMsg += '\nDeleting this role may affect user access.';
    }
    
    confirmMsg += '\n\nThis action cannot be undone.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiDeleteRole(roleId, function(response) {
        if (response.status === 'success') {
            showMessage('Role deleted successfully!', 'success');
            loadRoles();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// Show message

// Escape HTML to prevent XSS

// Logout function
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('roleModal');
    if (event.target === modal) {
        closeRoleModal();
    }
}
</script>

</body>
</html>
