
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>R-TechLab - Login</title>
<link rel="stylesheet" href="design-system.css">

<style>
/* Login page: center the login box vertically & horizontally */
body {
    display: flex;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
}

/* Compact feedback message inside the login box */
.login-box .message {
    margin-top: 10px;
    text-align: center;
    padding: 10px;
}

.login-box .loading {
    color: #666;
}
</style>
</head>

<body>

<div class="login-box">
    <div class="company-name-header">R-TechLab</div>
    <h2>Login</h2>

    <input type="text" id="loginid" placeholder="Login Id">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="message" id="msg"></div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Check if already logged in
window.onload = function() {
    if (hasLocalSession()) {
        window.location.href = 'home.html';
    }
};

function login() {
    let loginid = document.getElementById("loginid").value.trim();
    let password = document.getElementById("password").value.trim();
    let msgElement = document.getElementById("msg");
    let loginButton = document.querySelector("button");

    // Validation: prevent empty submission
    if (!loginid || !password) {
        msgElement.innerText = "Please enter both User ID and Password";
        msgElement.className = "message error";
        return;
    }

    // Show loading state
    msgElement.innerText = "Logging in...";
    msgElement.className = "message loading";
    loginButton.disabled = true;

    // Use the secure API function
    apiLogin(loginid, password, function(data) {
        loginButton.disabled = false;
        
        if (data.status === "success") {
            // Create session with server-generated sessionId
            createSession(data);
            
            msgElement.innerText = "Login Successful! Redirecting...";
            msgElement.className = "message success";
            
            // Redirect to home page after short delay
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1000);
        } else {
            msgElement.innerText = data.message || "Invalid credentials";
            msgElement.className = "message error";
        }
    });
}

// Allow Enter key to submit
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            login();
        }
    });
});
</script>

</body>
</html>
