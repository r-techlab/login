<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Opening Stock Balance - List</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--box">Opening Stock Balance</h1>
        <div>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>

        <div class="main-content">
            <div id="messageContainer"></div>

            <div class="stats-card" id="statsCard" style="display: none;">
                <div class="stat-item">
                    <h3 id="totalRecords">0</h3>
                    <p>Total Opening Stock Entries</p>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by DocNo, Narration, or Date..." onkeyup="filterOpeningStocks()">
                </div>
                <button class="btn btn-success" onclick="createNewOpeningStock()">➕ Add New Opening Stock</button>
            </div>

            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading opening stock entries</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📦</div>
                    <h3>No Opening Stock Entries Found</h3>
                    <p>Start by creating your first opening stock entry.</p>
                </div>
                <table id="openingStocksTable" style="display: none;">
                    <thead>
                        <tr>
            <th>Doc No</th>
                            <th>Date</th>
                            <th>Narration</th>
                            <th class="amount">Amount</th>
                            <th>Posted By</th>
                            <th>Posted Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="openingStocksTableBody">
                    </tbody>
                </table>
                <div class="pagination" id="paginationControls" style="display: none;">
                    <button class="nav-btn" onclick="goToFirstPage()" id="firstPageBtn" title="First Page">« First</button>
                    <button class="nav-btn" onclick="goToPage(currentPage - 1)" id="prevPageBtn" title="Previous Page">◀ Previous</button>
                    <div id="pageNumbers" style="display: inline-flex; gap: 3px; align-items: center;"></div>
                    <span class="page-info" id="pageInfo">Page 1 of 1</span>
                    <span class="total-records" id="totalRecordsSpan"></span>
                    <button class="nav-btn" onclick="goToPage(currentPage + 1)" id="nextPageBtn" title="Next Page">Next ▶</button>
                    <button class="nav-btn" onclick="goToLastPage()" id="lastPageBtn" title="Last Page">Last »</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let currentPage = 1;
let pageSize = 10;
let totalRecords = 0;
let totalPages = 0;
let currentSearch = '';

// Initialize system config with theme
initPageWithTheme('openingstocklist.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
        loadOpeningStocks();
    }
});

// Load opening stocks from server with pagination
function loadOpeningStocks() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('openingStocksTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('statsCard').style.display = 'none';
    document.getElementById('paginationControls').style.display = 'none';
    
    pageSize = parseInt(getSystemParameter('ListRowCount', '10')) || 10;
    
    const session = getSession();
    if (!session) return;
    
    getOpeningStocks(session, currentPage, pageSize, currentSearch, function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            var openingStocks = response.openingStocks || [];
            totalRecords = response.totalRecords || 0;
            totalPages = response.totalPages || 0;
            
            displayOpeningStocks(openingStocks);
            updateStats();
        } else {
            var errorMsg = response.message || 'Unknown error';
            showMessage('Error loading opening stocks: ' + errorMsg, 'error');
            console.error('Opening stocks API error:', response);
            document.getElementById('emptyState').style.display = 'block';
        }

    });
}

// Update statistics
function updateStats() {
    document.getElementById('totalRecords').textContent = totalRecords;
    document.getElementById('statsCard').style.display = 'flex';
}

// Display opening stocks in table
function displayOpeningStocks(openingStocks) {
    const tbody = document.getElementById('openingStocksTableBody');
    tbody.innerHTML = '';
    
    if (openingStocks.length === 0) {
        document.getElementById('openingStocksTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('paginationControls').style.display = 'none';
        return;
    }
    
    document.getElementById('openingStocksTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    
    openingStocks.forEach(function(os) {
        const row = document.createElement('tr');
        
        var postedBy = os.postedBy || '';
        var postedTime = os.postedTime || '';
        var isPosted = postedBy ? true : false;
        
        var postBtnHtml = '';
        var editBtnHtml = '';
        var deleteBtnHtml = '';
        if (isPosted) {
            postBtnHtml = '<button class="btn btn-warning btn-small" onclick="cancelPostOpeningStock(\'' + escapeHtml(os.docNo) + '\')">↩️ Cancel Post</button>';
            editBtnHtml = '<button class="btn btn-warning btn-small" disabled style="opacity:0.5;cursor:not-allowed;" title="Cannot edit - document is posted">✏️ Edit</button>';
            deleteBtnHtml = '<button class="btn btn-danger btn-small" disabled style="opacity:0.5;cursor:not-allowed;" title="Cannot delete - document is posted">🗑️ Delete</button>';
        } else {
            postBtnHtml = '<button class="btn btn-success btn-small" onclick="postOpeningStock(\'' + escapeHtml(os.docNo) + '\')">📤 Post</button>';
            editBtnHtml = '<button class="btn btn-warning btn-small" onclick="editOpeningStock(\'' + escapeHtml(os.docNo) + '\')">✏️ Edit</button>';
            deleteBtnHtml = '<button class="btn btn-danger btn-small" onclick="deleteOpeningStockData(\'' + escapeHtml(os.docNo) + '\')">🗑️ Delete</button>';
        }
        
        row.innerHTML = `
            <td><strong>${escapeHtml(os.docNo)}</strong></td>
            <td>${formatDate(os.date)}</td>
            <td>${escapeHtml(os.narration || '-')}</td>
            <td class="amount">${formatAmount(os.amount)}</td>
            <td>${escapeHtml(postedBy) || '-'}</td>
            <td>${escapeHtml(postedTime) || '-'}</td>
            <td>
                <div class="action-buttons">
                    <button class="btn btn-small" onclick="viewOpeningStock('${escapeHtml(os.docNo)}')">👁️ View</button>
                    ${editBtnHtml}
                    ${deleteBtnHtml}
                    ${postBtnHtml}
                </div>
            </td>
        `;
        
        tbody.appendChild(row);
    });
    
    updatePaginationControls();
}

// Update pagination controls
function updatePaginationControls() {
    const paginationControls = document.getElementById('paginationControls');
    const firstBtn = document.getElementById('firstPageBtn');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const lastBtn = document.getElementById('lastPageBtn');
    const pageInfo = document.getElementById('pageInfo');
    const totalRecordsSpan = document.getElementById('totalRecordsSpan');
    const pageNumbersDiv = document.getElementById('pageNumbers');
    
    paginationControls.style.display = 'flex';
    pageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
    totalRecordsSpan.textContent = '(' + totalRecords + ' records)';
    
    firstBtn.disabled = currentPage <= 1;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
    lastBtn.disabled = currentPage >= totalPages;
    
    pageNumbersDiv.innerHTML = '';
    
    if (totalPages <= 7) {
        for (let i = 1; i <= totalPages; i++) {
            pageNumbersDiv.appendChild(createPageButton(i));
        }
    } else {
        pageNumbersDiv.appendChild(createPageButton(1));
        
        if (currentPage > 3) {
            pageNumbersDiv.appendChild(createEllipsis());
        }
        
        let startPage = Math.max(2, currentPage - 1);
        let endPage = Math.min(totalPages - 1, currentPage + 1);
        
        if (currentPage <= 3) {
            startPage = 2;
            endPage = Math.min(4, totalPages - 1);
        }
        
        if (currentPage >= totalPages - 2) {
            startPage = Math.max(2, totalPages - 3);
            endPage = totalPages - 1;
        }
        
        for (let i = startPage; i <= endPage; i++) {
            pageNumbersDiv.appendChild(createPageButton(i));
        }
        
        if (currentPage < totalPages - 2) {
            pageNumbersDiv.appendChild(createEllipsis());
        }
        
        pageNumbersDiv.appendChild(createPageButton(totalPages));
    }
}

function createPageButton(pageNum) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (pageNum === currentPage ? ' active' : '');
    btn.textContent = pageNum;
    btn.onclick = function() { goToPage(pageNum); };
    btn.title = 'Page ' + pageNum;
    return btn;
}

function createEllipsis() {
    const span = document.createElement('span');
    span.className = 'page-ellipsis';
    span.textContent = '...';
    return span;
}

function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    if (page === currentPage) return;
    currentPage = page;
    loadOpeningStocks();
}

function goToFirstPage() {
    if (currentPage === 1) return;
    currentPage = 1;
    loadOpeningStocks();
}

function goToLastPage() {
    if (currentPage === totalPages) return;
    currentPage = totalPages;
    loadOpeningStocks();
}

function filterOpeningStocks() {
    currentSearch = document.getElementById('searchInput').value.toLowerCase();
    currentPage = 1;
    loadOpeningStocks();
}

function createNewOpeningStock() {
    window.location.href = 'openingstockform.htm';
}

function viewOpeningStock(docNo) {
    window.location.href = 'openingstockform.htm?view=' + encodeURIComponent(docNo);
}

function editOpeningStock(docNo) {
    window.location.href = 'openingstockform.htm?docno=' + encodeURIComponent(docNo);
}

function deleteOpeningStockData(docNo) {
    let confirmMsg = 'Are you sure you want to delete opening stock "' + docNo + '"?';
    confirmMsg += '\n\nThis action cannot be undone.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    const session = getSession();
    if (!session) return;
    
    deleteOpeningStock(session, docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Opening stock deleted successfully!', 'success');
            loadOpeningStocks();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}





function postOpeningStock(docNo) {
    var confirmMsg = 'Are you sure you want to post opening stock "' + docNo + '" to stock transaction?';
    confirmMsg += '\n\nThis will create stock transaction entries.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiPostSOPToStockTransaction(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Opening stock posted successfully!', 'success');
            loadOpeningStocks();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

function cancelPostOpeningStock(docNo) {
    var confirmMsg = 'Are you sure you want to cancel the post of opening stock "' + docNo + '"?';
    confirmMsg += '\n\nThis will remove the stock transaction entries.';
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    apiCancelSOPStockTransactionPost(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Opening stock post cancelled successfully!', 'success');
            loadOpeningStocks();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}
</script>

</body>
</html>
