<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock Adjustment Report</title>
<link rel="stylesheet" href="design-system.css">
<!-- Styles migrated to design-system.css -->
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--chart">Stock Adjustment Report</h1>
        <div>
            <button class="btn btn-success" onclick="window.print()">🖨️ Print</button>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>
    <div id="breadcrumbContainer" class="breadcrumb-container"></div>
    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>
        <div class="main-content">
            <div id="messageContainer"></div>
            <div class="filter-section">
                <div class="filter-group">
                    <label>From Date</label>
                    <input type="date" id="fromDate">
                </div>
                <div class="filter-group">
                    <label>To Date</label>
                    <input type="date" id="toDate">
                </div>
                <div class="filter-group">
                    <label>Report Type</label>
                    <select id="reportType">
                        <option value="headerwise">Header Wise</option>
                        <option value="itemwise">Item Wise</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-success" onclick="loadReport()">🔍 Generate Report</button>
                </div>
            </div>
            <div id="summaryCard" class="summary-card" style="display: none;"></div>
            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading report...</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <h3>No records found for the selected criteria</h3>
                </div>
                <div id="reportContent" style="display: none;">
                    <table>
                        <thead>
                            <tr id="reportTableHeader">
                                <th>Doc No</th>
                                <th>Date</th>
                                <th>Narration</th>
                                <th class="amount">Amount</th>
                                <th>Created By</th>
                                <th>Posted</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
initPageWithTheme('stockadjustmentreport.htm', 'companyNameSidebar');
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
        var today = new Date();
        document.getElementById('toDate').value = today.toISOString().slice(0,10);
        var firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        document.getElementById('fromDate').value = firstDay.toISOString().slice(0,10);
        loadReport();
    }
});

function loadReport() {
    var filters = {
        fromDate: document.getElementById('fromDate').value,
        toDate: document.getElementById('toDate').value,
        reportType: document.getElementById('reportType').value
    };
    
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('reportContent').style.display = 'none';
    document.getElementById('summaryCard').style.display = 'none';
    
    apiGetStockAdjustmentReport(filters, function(data) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (data.status === 'success') {
            var records = data.stockAdjustments || [];
            var summary = data.summary || {};
            
            if (records.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
            
            document.getElementById('reportContent').style.display = 'block';
            displaySummary(summary, data.reportType);
            displayRecords(records, data.reportType);
        } else {
            showMessage('Error: ' + (data.message || 'Unknown error'), 'error');
        }
    });
}

function displaySummary(summary, reportType) {
    var card = document.getElementById('summaryCard');
    var html = '<div class="summary-item"><h3>' + (summary.totalCount || 0) + '</h3><p>Total Records</p></div>';
    html += '<div class="summary-item"><h3>' + formatAmt(summary.totalAmount || 0) + '</h3><p>Total Amount</p></div>';
    if (reportType === 'itemwise') {
        html += '<div class="summary-item"><h3>' + formatAmt(summary.totalQty || 0) + '</h3><p>Total Qty</p></div>';
    }
    card.innerHTML = html;
    card.style.display = 'flex';
}

function displayRecords(records, reportType) {
    var tbody = document.getElementById('reportTableBody');
    tbody.innerHTML = '';
    
    records.forEach(function(r) {
        if (reportType === 'itemwise' && r.details && r.details.length > 0) {
            r.details.forEach(function(d) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + escapeHtml(r.docNo) + '</td><td>' + r.date + '</td><td>' + escapeHtml(d.stockCode + ' - ' + d.stockDescription) + '</td><td class="amount">' + (parseFloat(d.qty) || 0).toFixed(3) + '</td><td class="amount">' + formatAmt(d.amount) + '</td><td>' + escapeHtml(r.narration || '') + '</td>';
                tbody.appendChild(tr);
            });
        } else {
            var tr = document.createElement('tr');
            tr.innerHTML = '<td><strong>' + escapeHtml(r.docNo) + '</strong></td><td>' + r.date + '</td><td>' + escapeHtml(r.narration || '-') + '</td><td class="amount">' + formatAmt(r.amount) + '</td><td>' + escapeHtml(r.createdBy || '') + '</td><td>' + (r.postedBy ? 'Yes' : 'No') + '</td>';
            tbody.appendChild(tr);
        }
    });
}

function formatAmt(v) { return (parseFloat(v) || 0).toFixed(3); }
// escapeHtml provided by systemConfig.js
function logout() { if (confirm('Logout?')) performLogout(); }
</script>
</body>
</html>
