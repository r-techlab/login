<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cash Payment Voucher Report</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>

<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--chart">Cash Payment Voucher Report</h1>
        <div>
            <button class="btn" onclick="window.location.href='cashpaymentvoucherlist.htm'">📋 Voucher List</button>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>

        <div class="main-content">
            <div id="messageContainer"></div>

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-row">
                    <div class="filter-group">
                        <label>From Date</label>
                        <input type="date" id="fromDate">
                    </div>
                    <div class="filter-group">
                        <label>To Date</label>
                        <input type="date" id="toDate">
                    </div>
                    <div class="filter-group">
                        <label>Report Type</label>
                        <div style="display: flex; gap: 15px; padding-top: 5px;">
                            <label style="font-weight: normal; font-size: 14px; cursor: pointer;">
                                <input type="radio" name="reportType" value="headerwise" checked onchange="onReportTypeChange()"> Headerwise
                            </label>
                            <label style="font-weight: normal; font-size: 14px; cursor: pointer;">
                                <input type="radio" name="reportType" value="linewise" onchange="onReportTypeChange()"> Linewise
                            </label>
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-success" onclick="loadReport()">🔍 Generate Report</button>
                        <button class="btn btn-warning" onclick="resetFilters()">↺ Reset</button>
                        <button class="btn" onclick="exportToCSV()">📥 Export CSV</button>
                    </div>
                </div>
            </div>

            <!-- Data Table -->
            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading report data</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📒</div>
                    <h3>No Data Found</h3>
                    <p>Select filters and click "Generate Report" to view cash payment voucher data.</p>
                </div>
                <table id="reportTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Doc No</th>
                            <th>Date</th>
                            <th>Narration</th>
                            <th class="amount">Debit</th>
                            <th class="amount">Credit</th>
                            <th>Ref No</th>
                            <th>Ref Date</th>
                            <th>Created By</th>
                            <th>Posted By</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                    </tbody>
                    <tfoot id="reportTableFooter" style="display: none;">
                        <tr style="background: #e8f0fe; font-weight: bold; border-top: 2px solid #667eea;">
                            <td colspan="3" style="text-align: right; padding: 12px 15px; font-size: 14px;">Total (<span id="totalCountSpan">0</span> Vouchers):</td>
                            <td class="amount debit-amount" style="padding: 12px 15px; font-size: 14px;" id="totalDebitDisplay">0.00</td>
                            <td class="amount credit-amount" style="padding: 12px 15px; font-size: 14px;" id="totalCreditDisplay">0.00</td>
                            <td colspan="4" style="padding: 12px 15px;"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let reportData = [];
let reportSummary = null;

// Initialize system config with theme
initPageWithTheme('cashpaymentvoucherreport.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
    }
});

// Get selected report type
function getReportType() {
    var radios = document.getElementsByName('reportType');
    for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) {
            return radios[i].value;
        }
    }
    return 'headerwise';
}

// Called when report type radio changes - update table headers
function onReportTypeChange() {
    var isLinewise = getReportType() === 'linewise';
    var thead = document.querySelector('#reportTable thead tr');
    var tfoot = document.getElementById('reportTableFooter');
    
    if (isLinewise) {
        // Update headers for linewise
        thead.innerHTML = `
            <th>Doc No</th>
            <th>Date</th>
            <th>AC Code</th>
            <th>AC Description</th>
            <th>Subledger</th>
            <th class="amount">Debit</th>
            <th class="amount">Credit</th>
            <th>Line Narration</th>
        `;
        // Update footer
        var footerRow = tfoot.querySelector('tr');
        footerRow.innerHTML = `
            <td colspan="5" style="text-align: right; padding: 12px 15px; font-size: 14px;">Total (<span id="totalCountSpan">0</span> Vouchers):</td>
            <td class="amount debit-amount" style="padding: 12px 15px; font-size: 14px;" id="totalDebitDisplay">0.00</td>
            <td class="amount credit-amount" style="padding: 12px 15px; font-size: 14px;" id="totalCreditDisplay">0.00</td>
            <td colspan="1" style="padding: 12px 15px;"></td>
        `;
    } else {
        // Update headers for headerwise
        thead.innerHTML = `
            <th>Doc No</th>
            <th>Date</th>
            <th>Narration</th>
            <th class="amount">Debit</th>
            <th class="amount">Credit</th>
            <th>Ref No</th>
            <th>Ref Date</th>
            <th>Created By</th>
            <th>Posted By</th>
        `;
        // Update footer
        var footerRow = tfoot.querySelector('tr');
        footerRow.innerHTML = `
            <td colspan="3" style="text-align: right; padding: 12px 15px; font-size: 14px;">Total (<span id="totalCountSpan">0</span> Vouchers):</td>
            <td class="amount debit-amount" style="padding: 12px 15px; font-size: 14px;" id="totalDebitDisplay">0.00</td>
            <td class="amount credit-amount" style="padding: 12px 15px; font-size: 14px;" id="totalCreditDisplay">0.00</td>
            <td colspan="4" style="padding: 12px 15px;"></td>
        `;
    }
    
    // Re-fetch data with new report type if we have data
    if (reportData.length > 0) {
        loadReport();
    }
}

// Load report data
function loadReport() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('reportTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    
    var filters = {
        fromDate: document.getElementById('fromDate').value,
        toDate: document.getElementById('toDate').value,
        reportType: getReportType()
    };
    
    apiGetCashPaymentVoucherReport(filters, function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            reportData = response.jv || response.vouchers || [];
            reportSummary = response.summary || null;
            
            displayReport(reportData);
        } else {
            showMessage('Error loading report: ' + response.message, 'error');
            document.getElementById('emptyState').style.display = 'block';
        }
    });
}

// Display report in table
function displayReport(vouchers) {
    const tbody = document.getElementById('reportTableBody');
    tbody.innerHTML = '';
    
    if (vouchers.length === 0) {
        document.getElementById('reportTable').style.display = 'none';
        document.getElementById('reportTableFooter').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        return;
    }
    
    document.getElementById('reportTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    
    var isLinewise = getReportType() === 'linewise';
    
    vouchers.forEach(function(voucher) {
        if (isLinewise && voucher.details && voucher.details.length > 0) {
            // Linewise: one row per detail line with header info repeated
            voucher.details.forEach(function(item) {
                const row = document.createElement('tr');
                const debit = item.debit || (item.amount < 0 ? Math.abs(item.amount) : 0);
                const credit = item.credit || (item.amount > 0 ? item.amount : 0);
                
                row.innerHTML = `
                    <td><strong>${escapeHtml(voucher.docNo)}</strong></td>
                    <td>${formatDate(voucher.date)}</td>
                    <td><strong>${escapeHtml(item.acCode || '-')}</strong></td>
                    <td>${escapeHtml(item.acDescription || '-')}</td>
                    <td>${escapeHtml(item.subledger || '-')}</td>
                    <td class="amount debit-amount">${debit > 0 ? formatAmount(debit) : ''}</td>
                    <td class="amount credit-amount">${credit > 0 ? formatAmount(credit) : ''}</td>
                    <td>${escapeHtml(item.narration || '-')}</td>
                `;
                tbody.appendChild(row);
            });
        } else {
            // Headerwise: one row per voucher
            const row = document.createElement('tr');
            const isPosted = voucher.postedBy && voucher.postedBy !== '';
            row.innerHTML = `
                <td><strong>${escapeHtml(voucher.docNo)}</strong></td>
                <td>${formatDate(voucher.date)}</td>
                <td>${escapeHtml(voucher.narration || '-')}</td>
                <td class="amount debit-amount">${formatAmount(voucher.debit)}</td>
                <td class="amount credit-amount">${formatAmount(voucher.credit)}</td>
                <td>${escapeHtml(voucher.refNo || '-')}</td>
                <td>${formatDate(voucher.refDate)}</td>
                <td>${escapeHtml(voucher.createdBy || '-')}</td>
                <td>${isPosted ? '<span style="color: #27ae60; font-weight: bold;">✓</span> ' + escapeHtml(voucher.postedBy || '') : '<span style="color: #e74c3c;">-</span>'}</td>
            `;
            tbody.appendChild(row);
        }
    });
    
    // Show summary footer
    if (reportSummary) {
        document.getElementById('totalCountSpan').textContent = reportSummary.totalCount;
        document.getElementById('totalDebitDisplay').textContent = formatAmount(reportSummary.totalDebit);
        document.getElementById('totalCreditDisplay').textContent = formatAmount(reportSummary.totalCredit);
        document.getElementById('reportTableFooter').style.display = '';
    }
}

// Reset filters
function resetFilters() {
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
    
    // Hide results
    document.getElementById('reportTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').querySelector('p').textContent = 'Select filters and click "Generate Report" to view cash payment voucher data.';
}

// Export to CSV
function exportToCSV() {
    if (!reportData || reportData.length === 0) {
        showMessage('No data to export. Please generate a report first.', 'warning');
        return;
    }
    
    var isLinewise = getReportType() === 'linewise';
    var csv = '';
    
    if (isLinewise) {
        // Linewise CSV headers
        csv = 'Doc No,Date,AC Code,AC Description,Subledger,Debit,Credit,Line Narration\n';
        
        reportData.forEach(function(voucher) {
            if (voucher.details && voucher.details.length > 0) {
                voucher.details.forEach(function(item) {
                    var debit = item.debit || (item.amount < 0 ? Math.abs(item.amount) : 0);
                    var credit = item.credit || (item.amount > 0 ? item.amount : 0);
                    csv += '"' + (voucher.docNo || '') + '",';
                    csv += '"' + (voucher.date || '') + '",';
                    csv += '"' + (item.acCode || '') + '",';
                    csv += '"' + (item.acDescription || '') + '",';
                    csv += '"' + (item.subledger || '') + '",';
                    csv += (debit || 0) + ',';
                    csv += (credit || 0) + ',';
                    csv += '"' + (item.narration || '') + '"\n';
                });
            } else {
                csv += '"' + (voucher.docNo || '') + '",';
                csv += '"' + (voucher.date || '') + '",,,,,,\n';
            }
        });
    } else {
        // Headerwise CSV
        csv = 'Doc No,Date,Narration,Debit,Credit,Ref No,Ref Date,Created By,Posted By\n';
        
        reportData.forEach(function(voucher) {
            csv += '"' + (voucher.docNo || '') + '",';
            csv += '"' + (voucher.date || '') + '",';
            csv += '"' + (voucher.narration || '') + '",';
            csv += (voucher.debit || 0) + ',';
            csv += (voucher.credit || 0) + ',';
            csv += '"' + (voucher.refNo || '') + '",';
            csv += '"' + (voucher.refDate || '') + '",';
            csv += '"' + (voucher.createdBy || '') + '",';
            csv += '"' + (voucher.postedBy || '') + '"\n';
        });
    }
    
    // Add summary rows
    if (reportSummary) {
        csv += '\n';
        csv += 'SUMMARY\n';
        csv += 'Total Vouchers:,' + reportSummary.totalCount + '\n';
        csv += 'Total Debit:,' + reportSummary.totalDebit + '\n';
        csv += 'Total Credit:,' + reportSummary.totalCredit + '\n';
    }
    
    // Create download link
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    var url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', 'Cash_Payment_Voucher_Report_' + new Date().toISOString().slice(0, 10) + '.csv');
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    showMessage('Report exported successfully!', 'success');
}

// Logout function
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}
</script>

</body>
</html>
