<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock Adjustment - Form</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>
<body>

<div class="container container-wide">
    <div class="header">
        <h1 id="pageTitle" class="pg-icon pg-icon--swap">Stock Adjustment</h1>
        <div>
            <button class="btn" onclick="window.location.href='stockadjustmentlist.htm'">📋 Back to List</button>
            <button class="btn btn-secondary" id="refreshBtn" onclick="refreshMasterData()">🔄 Refresh Data</button>
            <button class="btn btn-warning" id="viewEditBtn" style="display: none;" onclick="editFromView()">✏️ Edit</button>
            <button class="btn btn-danger" id="viewDeleteBtn" style="display: none;" onclick="deleteFromView()">🗑️ Delete</button>
            <button class="btn btn-success" id="viewPrintBtn" style="display: none;" onclick="printFromView()">🖨️ Print</button>
            <button class="btn btn-success" id="viewPostBtn" style="display: none;" onclick="postFromView()">📤 Post</button>
            <button class="btn btn-warning" id="viewCancelPostBtn" style="display: none;" onclick="cancelPostFromView()">↩️ Cancel Post</button>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div id="messageContainer"></div>

    <div id="loadingIndicator" class="loading" style="display: none;">Loading stock adjustment...</div>

    <form id="stockAdjustmentForm" onsubmit="saveStockAdjustment(event)" style="display: none;">
        <!-- Header Section -->
        <div class="form-section" id="headerSection">
            <h3>Stock Adjustment Header</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Doc No</label>
                    <input type="text" id="docNo" disabled placeholder="Auto-generated">
                </div>
                <div class="form-group">
                    <label class="required">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="text" id="amount" disabled value="0.00">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Narration</label>
                    <textarea id="narration" rows="2"></textarea>
                </div>
            </div>
        </div>

        <!-- Details Section -->
        <div class="details-section">
            <h3>Stock Adjustment Items</h3>
            <div class="table-container">
                <table id="detailsTable">
                    <thead>
                        <tr>
                            <th style="width: 30px;">#</th>
                            <th style="min-width: 120px;">Stock Code</th>
                            <th style="min-width: 150px;">Description</th>
                            <th style="width: 70px;">Qty</th>
                            <th style="width: 120px;">Unit</th>
                            <th style="width: 80px;">Rate</th>
                            <th class="amount-cell">Amount</th>
                            <th style="width: 40px;"></th>
                        </tr>
                    </thead>
                    <tbody id="detailsTableBody">
                    </tbody>
                </table>
            </div>
            <div style="margin-top: 10px;">
                <button type="button" class="btn btn-success" onclick="addDetailLine()">➕ Add Item</button>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="summary-section">
            <table class="summary-table">
                <tr>
                    <td class="summary-label">Total Qty:</td>
                    <td class="summary-value" id="summaryQty">0.000</td>
                </tr>
                <tr class="summary-total">
                    <td class="summary-label">Total Amount:</td>
                    <td class="summary-value" id="summaryAmount">0.00</td>
                </tr>
            </table>
        </div>

        <!-- Action Buttons -->
        <div id="formActions" style="text-align: center; margin-top: 20px;">
            <button type="submit" class="btn btn-success" id="saveButton">💾 Save Stock Adjustment</button>
            <button type="button" class="btn" onclick="cancelForm()">✖ Cancel</button>
        </div>

    </form>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// ============================================
// GLOBAL VARIABLES
// ============================================
let editMode = false;
let viewMode = false;
let editDocNo = null;
let viewDocNo = null;
let detailLineCounter = 0;
let allStocks = [];
let masterDataLoaded = false;

// Initialize system config with theme
initPageWithTheme('stockadjustmentform.htm', null);

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        renderBreadcrumb('breadcrumbContainer');
        
        // Check URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        viewDocNo = urlParams.get('view');
        editDocNo = urlParams.get('docno');
        
        if (viewDocNo) {
            viewMode = true;
            editMode = false;
            document.getElementById('pageTitle').textContent = 'Stock Adjustment';
            document.getElementById('formActions').style.display = 'none';
            document.getElementById('viewEditBtn').style.display = 'inline-block';
            document.getElementById('viewDeleteBtn').style.display = 'inline-block';
            document.getElementById('viewPrintBtn').style.display = 'inline-block';
            document.getElementById('headerSection').classList.add('view-mode');
            document.getElementById('detailsTable').classList.add('view-mode');
            loadMasterData(function() {
                loadStockAdjustmentForView(viewDocNo);
            });
        } else if (editDocNo) {
            editMode = true;
            viewMode = false;
            document.getElementById('pageTitle').textContent = 'Stock Adjustment';
            document.getElementById('saveButton').textContent = '💾 Update Stock Adjustment';
            loadMasterData(function() {
                loadStockAdjustmentForEdit(editDocNo);
            });
        } else {
            // New - set default date
            document.getElementById('date').value = new Date().toISOString().slice(0, 10);
            // DocNo is auto-generated by the server on save (same as Sales/Purchase forms)
            loadMasterData(function() {
                document.getElementById('stockAdjustmentForm').style.display = 'block';
                addDetailLine();
            });
        }
    }
});

// Load master data (stocks)
function loadMasterData(callback) {
    loadStocks(function() {
        masterDataLoaded = true;
        if (typeof callback === 'function') {
            callback();
        }
    });
}

// Load stocks from IndexedDB or API
function loadStocks(callback) {
    if (typeof getStocksFromDB === 'function') {
        getStocksFromDB(function(cachedStocks) {
            if (cachedStocks && cachedStocks.length > 0) {
                allStocks = cachedStocks;
                if (typeof callback === 'function') callback();
            } else {
                apiGetStocks(function(response) {
                    if (response.status === 'success') {
                        allStocks = response.stocks || [];
                        if (typeof saveStocksToDB === 'function') {
                            saveStocksToDB(allStocks);
                        }
                    } else {
                        showMessage('Error loading stocks: ' + (response.message || 'Unknown error') + '. Click "Refresh Data" to retry.', 'warning');
                    }
                    if (typeof callback === 'function') callback();
                });
            }
        });
    } else {
        apiGetStocks(function(response) {
            if (response.status === 'success') {
                allStocks = response.stocks || [];
            } else {
                showMessage('Error loading stocks: ' + (response.message || 'Unknown error') + '. Click "Refresh Data" to retry.', 'warning');
            }
            if (typeof callback === 'function') callback();
        });
    }
}

// Note: the DocNo is generated by the server when the record is saved
// (handleCreateStockAdjustmentGet returns result.docNo) - see saveStockAdjustment().

// ============================================
// DETAIL LINES MANAGEMENT
// ============================================

// Add detail line
function addDetailLine(data = null) {
    detailLineCounter++;
    const tbody = document.getElementById('detailsTableBody');
    const row = tbody.insertRow();
    row.id = 'detailRow' + detailLineCounter;
    
    const srNo = tbody.rows.length;
    
    row.innerHTML = `
        <td>${srNo}</td>
        <td>
            <input type="text" class="stock-search" data-row="${detailLineCounter}" 
                   placeholder="Search..." value="${data ? data.stockCode : ''}" required>
            <input type="hidden" class="stock-code" value="${data ? data.stockCode : ''}">
        </td>
        <td><input type="text" class="stock-desc" disabled value="${data ? data.stockDescription : ''}"></td>
        <td><input type="number" class="qty" step="0.001" value="${data ? data.qty : ''}" 
                   onchange="calculateLine(${detailLineCounter})" required
                   title="Positive = Up (add stock), Negative = Down (remove stock)"></td>
        <td>
            <select class="unit" disabled>
                <option value="">Select Unit</option>
            </select>
        </td>
        <td><input type="number" class="rate" step="0.001" min="0" value="${data ? Math.abs(data.rate) : ''}" 
                   onchange="calculateLine(${detailLineCounter})" required></td>
        <td class="amount-cell"><input type="number" class="amount" step="0.001" disabled value="${data ? data.amount : '0.000'}"></td>
        <td><button type="button" class="btn btn-danger btn-icon" onclick="removeDetailLine(${detailLineCounter})">🗑️</button></td>
    `;
    
    setupStockSearch(detailLineCounter);
    
    if (data) {
        loadStockUnits(detailLineCounter, data.stockCode, data.unit);
        calculateLine(detailLineCounter);
    }
}

// Setup stock searchable input
function setupStockSearch(rowId) {
    const row = document.getElementById('detailRow' + rowId);
    const searchInput = row.querySelector('.stock-search');
    
    let dropdown = null;
    let repositionHandler = null;
    
    // Position dropdown below the input using fixed positioning (escapes overflow clipping)
    function positionDropdown() {
        if (!dropdown) return;
        const rect = searchInput.getBoundingClientRect();
        dropdown.style.position = 'fixed';
        dropdown.style.top = (rect.bottom + 2) + 'px';
        dropdown.style.left = rect.left + 'px';
        dropdown.style.width = rect.width + 'px';
        dropdown.style.maxHeight = '200px';
        dropdown.style.overflowY = 'auto';
        dropdown.style.zIndex = '10000';
        dropdown.style.display = 'block';
    }
    
    // Close and clean up dropdown
    function closeDropdown() {
        if (dropdown) {
            dropdown.remove();
            dropdown = null;
        }
        if (repositionHandler) {
            window.removeEventListener('scroll', repositionHandler, true);
            window.removeEventListener('resize', repositionHandler);
            repositionHandler = null;
        }
    }
    
    searchInput.addEventListener('input', function() {
        closeDropdown();
        
        const searchTerm = this.value.toLowerCase();
        
        if (searchTerm.length < 1) return;
        
        const filtered = allStocks.filter(s => 
            String(s.code).toLowerCase().includes(searchTerm) ||
            String(s.description).toLowerCase().includes(searchTerm)
        );
        
        if (filtered.length > 0) {
            dropdown = document.createElement('div');
            dropdown.className = 'searchable-dropdown active';
            
            dropdown.innerHTML = filtered.map(s => 
                `<div class="dropdown-item" onclick="selectStock(${rowId}, '${escapeHtml(s.code)}', '${escapeHtml(s.description)}', '${escapeHtml(s.unitCode || '')}')">
                    <strong>${s.code}</strong> - ${s.description}
                </div>`
            ).join('');
            
            // Append to body to escape overflow clipping from the table container
            document.body.appendChild(dropdown);
            positionDropdown();
            
            // Reposition on scroll/resize while open
            repositionHandler = function() {
                positionDropdown();
            };
            window.addEventListener('scroll', repositionHandler, true);
            window.addEventListener('resize', repositionHandler);
        }
    });
    
    searchInput.addEventListener('blur', function() {
        setTimeout(() => {
            closeDropdown();
        }, 200);
    });
}

// Select stock
function selectStock(rowId, code, description, unit) {
    const row = document.getElementById('detailRow' + rowId);
    row.querySelector('.stock-code').value = code;
    row.querySelector('.stock-search').value = code;
    row.querySelector('.stock-desc').value = description;
    
    loadStockUnits(rowId, code, unit);
    
    calculateLine(rowId);
}

// Load available units for a stock and populate the unit dropdown
// IndexedDB is checked first - the server is only called on a cache miss
function loadStockUnits(rowId, stockCode, defaultUnit) {
    const row = document.getElementById('detailRow' + rowId);
    const unitSelect = row.querySelector('.unit');
    
    unitSelect.disabled = true;
    unitSelect.innerHTML = '<option value="">Loading...</option>';
    
    const stockMaster = allStocks.find(s => s.code === stockCode);
    const baseUnit = (stockMaster && stockMaster.unitCode) || defaultUnit || 'PCS';
    
    // Build the unit dropdown from the available units of this stock
    function renderUnits(stockUnits) {
        unitSelect.innerHTML = '';
        const addedUnits = [];
        
        unitSelect.innerHTML += `<option value="${escapeHtml(baseUnit)}">${escapeHtml(baseUnit)} (Base)</option>`;
        addedUnits.push(baseUnit);
        
        if (stockUnits) {
            stockUnits.forEach(function(u) {
                if (!addedUnits.includes(u.unit)) {
                    unitSelect.innerHTML += `<option value="${escapeHtml(u.unit)}">${escapeHtml(u.unit)}</option>`;
                    addedUnits.push(u.unit);
                }
            });
        }
        
        const unitToSelect = defaultUnit || baseUnit;
        unitSelect.value = unitToSelect;
        
        if (!unitSelect.value) {
            unitSelect.innerHTML += `<option value="${escapeHtml(unitToSelect)}">${escapeHtml(unitToSelect)}</option>`;
            unitSelect.value = unitToSelect;
        }
        
        if (!viewMode) {
            unitSelect.disabled = false;
        }
    }
    
    // Try IndexedDB first (fast - no server call once this stock has been used)
    if (typeof getStockUnitsFromDB === 'function') {
        getStockUnitsFromDB(stockCode, function(cachedUnits) {
            if (cachedUnits) {
                renderUnits(cachedUnits);
                return;
            }
            
            apiGetStockUnits(stockCode, function(response) {
                const stockUnits = (response.status === 'success' && response.stockUnits) ? response.stockUnits : [];
                if (response.status === 'success' && typeof saveStockUnitsToDB === 'function') {
                    saveStockUnitsToDB(stockCode, stockUnits);
                }
                renderUnits(stockUnits);
            });
        });
    } else {
        apiGetStockUnits(stockCode, function(response) {
            renderUnits((response.status === 'success' && response.stockUnits) ? response.stockUnits : []);
        });
    }
}

// Remove detail line
function removeDetailLine(rowId) {
    const row = document.getElementById('detailRow' + rowId);
    if (document.getElementById('detailsTableBody').rows.length > 1) {
        row.remove();
        renumberRows();
        calculateSummary();
    } else {
        showMessage('At least one item is required.', 'warning');
    }
}

// Renumber rows after deletion
function renumberRows() {
    const tbody = document.getElementById('detailsTableBody');
    for (let i = 0; i < tbody.rows.length; i++) {
        tbody.rows[i].cells[0].textContent = i + 1;
    }
}

// Calculate line
function calculateLine(rowId) {
    const row = document.getElementById('detailRow' + rowId);
    const qty = parseFloat(row.querySelector('.qty').value) || 0;
    const rate = parseFloat(row.querySelector('.rate').value) || 0;
    const amount = qty * rate;
    row.querySelector('.amount').value = amount.toFixed(3);
    calculateSummary();
}

// Calculate summary
function calculateSummary() {
    const tbody = document.getElementById('detailsTableBody');
    let totalQty = 0;
    let totalAmount = 0;
    
    for (let i = 0; i < tbody.rows.length; i++) {
        totalQty += parseFloat(tbody.rows[i].querySelector('.qty').value) || 0;
        totalAmount += parseFloat(tbody.rows[i].querySelector('.amount').value) || 0;
    }
    
    document.getElementById('summaryQty').textContent = totalQty.toFixed(3);
    document.getElementById('summaryAmount').textContent = totalAmount.toFixed(3);
    document.getElementById('amount').value = totalAmount.toFixed(3);
}

// ============================================
// FORM DATA
// ============================================

function getFormData() {
    const header = {
        docNo: document.getElementById('docNo').value,
        date: document.getElementById('date').value,
        amount: parseFloat(document.getElementById('amount').value) || 0,
        narration: document.getElementById('narration').value
    };
    
    const tbody = document.getElementById('detailsTableBody');
    const details = [];
    
    for (let i = 0; i < tbody.rows.length; i++) {
        const stockCode = tbody.rows[i].querySelector('.stock-code').value;
        if (!stockCode) continue;
        
        details.push({
            docSrNo: i + 1,
            stockCode: stockCode,
            stockDescription: tbody.rows[i].querySelector('.stock-desc').value,
            qty: parseFloat(tbody.rows[i].querySelector('.qty').value) || 0,
            unit: tbody.rows[i].querySelector('.unit').value,
            rate: parseFloat(tbody.rows[i].querySelector('.rate').value) || 0,
            amount: parseFloat(tbody.rows[i].querySelector('.amount').value) || 0
        });
    }
    
    return { header: header, details: details };
}

function validateForm(data) {
    if (!data.header.date) {
        showMessage('Please select a date.', 'error');
        return false;
    }
    
    if (data.details.length === 0) {
        showMessage('Please add at least one item with a stock code.', 'error');
        return false;
    }
    
    for (let i = 0; i < data.details.length; i++) {
        const d = data.details[i];
        if (!d.stockCode) {
            showMessage('Row ' + (i + 1) + ': Stock code is required.', 'error');
            return false;
        }
        if (d.qty === 0) {
            showMessage('Row ' + (i + 1) + ': Quantity cannot be zero. Positive for Up (add stock), negative for Down (remove stock).', 'error');
            return false;
        }
        if (d.rate <= 0) {
            showMessage('Row ' + (i + 1) + ': Rate must be greater than 0.', 'error');
            return false;
        }
    }
    
    return true;
}

// ============================================
// SAVE / UPDATE
// ============================================

function saveStockAdjustment(event) {
    event.preventDefault();
    
    if (editMode) {
        updateStockAdjustmentData();
        return;
    }
    
    const session = getSession();
    if (!session) return;
    
    const data = getFormData();
    if (!validateForm(data)) return;
    
    document.getElementById('saveButton').disabled = true;
    document.getElementById('saveButton').textContent = '⏳ Saving...';
    
    createStockAdjustment(session, data, function(result) {
        document.getElementById('saveButton').disabled = false;
        document.getElementById('saveButton').textContent = '💾 Save Stock Adjustment';
        
        if (result.status === 'success') {
            showMessage('Stock adjustment ' + result.docNo + ' created successfully!', 'success');
            document.getElementById('docNo').value = result.docNo;
            editMode = true;
            viewMode = false;
            document.getElementById('pageTitle').textContent = 'Stock Adjustment';
            document.getElementById('saveButton').textContent = '💾 Update Stock Adjustment';
            document.getElementById('viewEditBtn').style.display = 'none';
            document.getElementById('viewDeleteBtn').style.display = 'none';
            document.getElementById('viewPrintBtn').style.display = 'none';
        } else {
            showMessage(result.message || 'Failed to save stock adjustment.', 'error');
        }
    });
}

function updateStockAdjustmentData() {
    const session = getSession();
    if (!session) return;
    
    const data = getFormData();
    if (!validateForm(data)) return;
    
    document.getElementById('saveButton').disabled = true;
    document.getElementById('saveButton').textContent = '⏳ Updating...';
    
    updateStockAdjustment(session, data, function(result) {
        document.getElementById('saveButton').disabled = false;
        document.getElementById('saveButton').textContent = '💾 Update Stock Adjustment';
        
        if (result.status === 'success') {
            showMessage('Stock adjustment updated successfully!', 'success');
        } else {
            showMessage(result.message || 'Failed to update stock adjustment.', 'error');
        }
    });
}

// ============================================
// LOAD FOR VIEW / EDIT
// ============================================

function loadStockAdjustmentForView(docNo) {
    loadStockAdjustmentData(docNo, function(header, details) {
        document.getElementById('stockAdjustmentForm').style.display = 'block';
        document.getElementById('headerSection').classList.add('view-mode');
        document.getElementById('detailsTable').classList.add('view-mode');
        
        var postedBy = header.postedBy || '';
        if (postedBy) {
            document.getElementById('viewPostBtn').style.display = 'none';
            document.getElementById('viewCancelPostBtn').style.display = 'inline-block';
            document.getElementById('viewEditBtn').style.display = 'none';
            document.getElementById('viewDeleteBtn').style.display = 'none';
        } else {
            document.getElementById('viewPostBtn').style.display = 'inline-block';
            document.getElementById('viewCancelPostBtn').style.display = 'none';
            document.getElementById('viewEditBtn').style.display = 'inline-block';
            document.getElementById('viewDeleteBtn').style.display = 'inline-block';
        }
    });
}

function loadStockAdjustmentForEdit(docNo) {
    loadStockAdjustmentData(docNo, function(header, details) {
        document.getElementById('stockAdjustmentForm').style.display = 'block';
    });
}

function loadStockAdjustmentData(docNo, callback) {
    const session = getSession();
    if (!session) return;
    
    document.getElementById('loadingIndicator').style.display = 'block';
    
    getStockAdjustmentByDocNo(session, docNo, function(data) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (data.status === 'success' && data.stockAdjustment) {
            const sa = data.stockAdjustment;
            const header = sa.header;
            const details = sa.details;
            
            document.getElementById('docNo').value = header.docNo;
            document.getElementById('date').value = header.date;
            document.getElementById('amount').value = parseFloat(header.amount || 0).toFixed(3);
            document.getElementById('narration').value = header.narration || '';
            
            if (details && details.length > 0) {
                details.forEach(function(d) {
                    addDetailLine(d);
                });
            } else {
                addDetailLine();
            }
            
            calculateSummary();
            
            if (typeof callback === 'function') {
                callback(header, details);
            }
        } else {
            showMessage('Failed to load stock adjustment: ' + (data.message || 'Unknown error'), 'error');
        }
    });
}

// ============================================
// VIEW MODE ACTIONS
// ============================================

function editFromView() {
    const docNo = document.getElementById('docNo').value;
    if (docNo) {
        window.location.href = 'stockadjustmentform.htm?docno=' + encodeURIComponent(docNo);
    }
}

function deleteFromView() {
    const docNo = document.getElementById('docNo').value;
    if (!docNo) return;
    
    if (!confirm('Are you sure you want to delete stock adjustment "' + docNo + '"?\n\nThis action cannot be undone.')) {
        return;
    }
    
    const session = getSession();
    if (!session) return;
    
    deleteStockAdjustment(session, docNo, function(result) {
        if (result.status === 'success') {
            showMessage('Stock adjustment deleted successfully!', 'success');
            setTimeout(function() {
                window.location.href = 'stockadjustmentlist.htm';
            }, 1500);
        } else {
            showMessage(result.message || 'Failed to delete stock adjustment.', 'error');
        }
    });
}

function printFromView() {
    const docNo = document.getElementById('docNo').value;
    if (docNo) {
        window.open('stockadjustmentprint.htm?docNo=' + encodeURIComponent(docNo), '_blank');
    }
}

function postFromView() {
    const docNo = document.getElementById('docNo').value;
    if (!docNo) return;
    
    if (!confirm('Are you sure you want to post stock adjustment "' + docNo + '" to stock transaction?\n\nThis will create stock transaction entries.')) {
        return;
    }
    
    apiPostADJToStockTransaction(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Stock adjustment posted successfully!', 'success');
            document.getElementById('viewPostBtn').style.display = 'none';
            document.getElementById('viewCancelPostBtn').style.display = 'inline-block';
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

function cancelPostFromView() {
    const docNo = document.getElementById('docNo').value;
    if (!docNo) return;
    
    if (!confirm('Are you sure you want to cancel the post of stock adjustment "' + docNo + '"?\n\nThis will remove the stock transaction entries.')) {
        return;
    }
    
    apiCancelADJStockTransactionPost(docNo, function(response) {
        if (response.status === 'success') {
            showMessage('Stock adjustment post cancelled successfully!', 'success');
            document.getElementById('viewPostBtn').style.display = 'inline-block';
            document.getElementById('viewCancelPostBtn').style.display = 'none';
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// ============================================
// REFRESH MASTER DATA
// ============================================

// Refresh master data from server
function refreshMasterData() {
    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.disabled = true;
    refreshBtn.textContent = '⏳ Refreshing...';
    
    refreshMasterDataFromServer(function(result) {
        // Reload data from IndexedDB (now freshly populated)
        allStocks = [];
        
        getStocksFromDB(function(stocks) {
            allStocks = stocks || [];
            
            refreshBtn.disabled = false;
            refreshBtn.textContent = '🔄 Refresh Data';
            
            if (result.status === 'success') {
                showMessage('Master data refreshed successfully from server!', 'success');
            } else {
                showMessage('Some data may not have refreshed. Check your connection.', 'error');
            }
        });
    });
}

function cancelForm() {
    if (confirm('Are you sure you want to cancel? Any unsaved changes will be lost.')) {
        window.location.href = 'stockadjustmentlist.htm';
    }
}



function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}
