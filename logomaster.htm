<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo Master - Logo Management</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--image">Logo Master</h1>
        <div>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>

        <div class="main-content">
            <div id="messageContainer"></div>

            <div class="stats-card" id="statsCard" style="display: none;">
                <div class="stat-item">
                    <h3 id="totalLogos">0</h3>
                    <p>Total Logos</p>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by Code or Description..." onkeyup="filterLogos()">
                </div>
            </div>

            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading logos</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">🖼️</div>
                    <h3>No Logos Found</h3>
                    <p>Start by adding your first logo.</p>
                </div>
                <table id="logosTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Description</th>
                            <th>Logo</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="logosTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Update Logo Image Modal -->
<div id="logoModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Update Logo Image</h2>
            <span class="close" onclick="closeLogoModal()">&times;</span>
        </div>
        <form id="logoForm" onsubmit="saveLogo(event)">
            <div class="form-group">
                <label>Logo Code</label>
                <input type="text" id="logoCode" disabled>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="logoDescription" disabled>
            </div>
            <div class="form-group">
                <label for="logoFile">Select New Logo Image</label>
                <input type="file" id="logoFile" accept="image/*" onchange="previewLogo(event)">
                <small>Select an image file (PNG, JPG, GIF, etc.)</small>
                <div class="logo-preview-container" id="logoPreviewContainer">
                    <span class="placeholder">Current logo preview</span>
                </div>
                <input type="hidden" id="logoPath">
                <input type="hidden" id="logoDataField">
            </div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="closeLogoModal()">Cancel</button>
                <button type="submit" class="btn btn-warning" id="saveButton">Update Image</button>
            </div>
        </form>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let allLogos = [];
let editingLogoCode = null;
let selectedLogoFile = null;

// Initialize system config with theme
initPageWithTheme('logomaster.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        // User has permission via RoleMenuAccess
        // Render menu and breadcrumb
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
        
        // Load initial data
        loadLogos();
    }
});

// Load all logos
function loadLogos() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('logosTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('statsCard').style.display = 'none';
    
    apiGetLogos(function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            allLogos = response.logos;
            displayLogos(allLogos);
            updateStats();
        } else {
            showMessage('Error loading logos: ' + response.message, 'error');
            document.getElementById('emptyState').style.display = 'block';
        }
    });
}

// Update statistics
function updateStats() {
    document.getElementById('totalLogos').textContent = allLogos.length;
    document.getElementById('statsCard').style.display = 'flex';
}

// Display logos in table
function displayLogos(logos) {
    const tbody = document.getElementById('logosTableBody');
    tbody.innerHTML = '';
    
    if (logos.length === 0) {
        document.getElementById('logosTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        return;
    }
    
    document.getElementById('logosTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    
    logos.forEach(logo => {
        const row = document.createElement('tr');
        
        // Use logoPath first, fall back to logoData (base64) if available
        const displayPath = logo.logoPath || (logo.logoData ? 'data:image/jpeg;base64,' + logo.logoData : '');
        const logoImg = displayPath 
            ? `<img src="${escapeHtml(displayPath)}" class="logo-thumb" alt="${escapeHtml(logo.description)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Crect fill=%22%23ddd%22 width=%2260%22 height=%2260%22/%3E%3Ctext x=%2230%22 y=%2235%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2224%22%3E🖼%3C/text%3E%3C/svg%3E'">`
            : `<div class="logo-thumb" style="display:flex;align-items:center;justify-content:center;background:#f0f0f0;font-size:24px;">🖼️</div>`;
        
        row.innerHTML = `
            <td><strong>${escapeHtml(logo.code)}</strong></td>
            <td>${escapeHtml(logo.description)}</td>
            <td>${logoImg}</td>
            <td>
                <div class="action-buttons">
                    <button class="btn btn-warning btn-small" onclick="openEditLogoModal('${escapeHtml(logo.code)}')">✏️ Update Image</button>
                </div>
            </td>
        `;
        
        tbody.appendChild(row);
    });
}

// Filter logos based on search
function filterLogos() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = allLogos.filter(logo => {
        return logo.code.toLowerCase().includes(searchTerm) ||
               logo.description.toLowerCase().includes(searchTerm);
    });
    
    displayLogos(filtered);
}

// Preview selected logo (with resizing for preview)
function previewLogo(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    selectedLogoFile = file;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const container = document.getElementById('logoPreviewContainer');
        container.innerHTML = `<img src="${e.target.result}" alt="Logo preview">`;
    };
    reader.readAsDataURL(file);
}

// Open edit logo modal - only for updating the image
function openEditLogoModal(logoCode) {
    const logo = allLogos.find(l => l.code.toString() == logoCode.toString());
    if (!logo) return;
    
    editingLogoCode = logoCode;
    selectedLogoFile = null;
    document.getElementById('modalTitle').textContent = 'Update Logo Image';
    document.getElementById('logoCode').value = logo.code;
    document.getElementById('logoDescription').value = logo.description;
    document.getElementById('logoPath').value = logo.logoPath || '';
    document.getElementById('logoDataField').value = '';
    document.getElementById('logoFile').value = '';
    
    // Show existing logo preview
    const container = document.getElementById('logoPreviewContainer');
    const displayPath = logo.logoPath || (logo.logoData ? 'data:image/jpeg;base64,' + logo.logoData : '');
    if (displayPath) {
        container.innerHTML = `<img src="${escapeHtml(displayPath)}" alt="Current logo">`;
    } else {
        container.innerHTML = '<span class="placeholder">No logo uploaded</span>';
    }
    
    document.getElementById('saveButton').textContent = 'Update Image';
    document.getElementById('saveButton').disabled = false;
    document.getElementById('logoModal').style.display = 'block';
}

// Close logo modal
function closeLogoModal() {
    document.getElementById('logoModal').style.display = 'none';
    document.getElementById('logoForm').reset();
    editingLogoCode = null;
    selectedLogoFile = null;
}

// Save logo - only updates the image
function saveLogo(event) {
    event.preventDefault();
    
    if (!selectedLogoFile) {
        showMessage('Please select a new logo image to upload', 'error');
        return;
    }
    
    const saveButton = document.getElementById('saveButton');
    saveButton.disabled = true;
    saveButton.textContent = 'Updating...';
    
    // Process the selected file
    uploadLogoFile(selectedLogoFile, function(logoPath) {
        if (logoPath) {
            document.getElementById('logoPath').value = logoPath;
        }
        saveLogoData(saveButton);
    });
}

// Upload logo file - stores base64 data directly in the sheet (no Drive needed)
function uploadLogoFile(file, callback) {
    // First, resize the image to reduce file size
    const reader = new FileReader();
    
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            // Resize to max 800px width/height while maintaining aspect ratio
            const MAX_SIZE = 800;
            let width = img.width;
            let height = img.height;
            
            if (width > MAX_SIZE || height > MAX_SIZE) {
                if (width > height) {
                    height = Math.round(height * MAX_SIZE / width);
                    width = MAX_SIZE;
                } else {
                    width = Math.round(width * MAX_SIZE / height);
                    height = MAX_SIZE;
                }
            }
            
            // Draw resized image on canvas
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            // Get resized base64 data (JPEG with 0.9 quality for smaller size)
            const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            const base64Data = resizedDataUrl.split(',')[1];
            
            // Store the data URL in logoPath for display
            document.getElementById('logoPath').value = resizedDataUrl;
            // Store the raw base64 in logoDataField for saving to sheet
            document.getElementById('logoDataField').value = base64Data;
            
            // Callback with the data URL (no separate API call needed)
            callback(resizedDataUrl);
        };
        
        img.onerror = function() {
            // If image loading fails, use the original file data
            const resizedDataUrl = e.target.result;
            const base64Data = resizedDataUrl.split(',')[1];
            
            // Store the data URL in logoPath for display
            document.getElementById('logoPath').value = resizedDataUrl;
            // Store the raw base64 in logoDataField for saving to sheet
            document.getElementById('logoDataField').value = base64Data;
            
            // Callback with the data URL (no separate API call needed)
            callback(resizedDataUrl);
        };
        
        img.src = e.target.result;
    };
    
    reader.onerror = function() {
        showMessage('Error reading file', 'error');
        callback(null);
    };
    
    reader.readAsDataURL(file);
}

// Save logo data to server - only updates the image
function saveLogoData(saveButton) {
    const logoCode = document.getElementById('logoCode').value;
    const logoDescription = document.getElementById('logoDescription').value;
    const logoPath = document.getElementById('logoPath').value;
    const logoDataField = document.getElementById('logoDataField');
    const logoDataValue = logoDataField ? logoDataField.value : '';
    
    const logoData = {
        code: logoCode,
        description: logoDescription,
        logoPath: logoPath,
        logoData: logoDataValue
    };
    
    // Update existing logo
    apiUpdateLogo(logoData, function(response) {
        saveButton.disabled = false;
        saveButton.textContent = 'Update Image';
        
        if (response.status === 'success') {
            showMessage('Logo image updated successfully!', 'success');
            closeLogoModal();
            loadLogos();
        } else {
            showMessage('Error: ' + response.message, 'error');
        }
    });
}

// Show message

// Escape HTML to prevent XSS

// Logout function
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('logoModal');
    if (event.target === modal) {
        closeLogoModal();
    }
}
</script>

</body>
</html>
