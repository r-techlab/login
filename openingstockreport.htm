<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Opening Stock Report</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>

<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--chart">Opening Stock Report</h1>
        <div>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>

        <div class="main-content">
            <div id="messageContainer"></div>

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-row">
                    <div class="filter-group">
                        <label>From Date</label>
                        <input type="date" id="fromDate">
                    </div>
                    <div class="filter-group">
                        <label>To Date</label>
                        <input type="date" id="toDate">
                    </div>
                    <div class="filter-group">
                        <label>Report Type</label>
                        <div style="display: flex; gap: 15px; padding-top: 5px;">
                            <label style="font-weight: normal; font-size: 14px; cursor: pointer;">
                                <input type="radio" name="reportType" value="headerwise" checked onchange="onReportTypeChange()"> Headerwise
                            </label>
                            <label style="font-weight: normal; font-size: 14px; cursor: pointer;">
                                <input type="radio" name="reportType" value="itemwise" onchange="onReportTypeChange()"> Itemwise
                            </label>
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-success" onclick="loadReport()">🔍 Generate Report</button>
                        <button class="btn btn-warning" onclick="resetFilters()">↺ Reset</button>
                        <button class="btn" onclick="exportToCSV()">📥 Export CSV</button>
                    </div>
                </div>
            </div>

            <!-- Data Table -->
            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading report data</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📦</div>
                    <h3>No Data Found</h3>
                    <p>Select filters and click "Generate Report" to view opening stock data.</p>
                </div>
                <table id="reportTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Doc No</th>
                            <th>Date</th>
                            <th>Narration</th>
                            <th class="amount">Amount</th>
                            <th>Posted By</th>
                            <th>Posted Time</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                    </tbody>
                    <tfoot id="reportTableFooter" style="display: none;">
                        <tr style="background: #e8f0fe; font-weight: bold; border-top: 2px solid #667eea;">
                            <td colspan="2" style="text-align: right; padding: 12px 15px; font-size: 14px;">Total (<span id="totalCountSpan">0</span> Entries):</td>
                            <td></td>
                            <td class="amount" style="padding: 12px 15px; font-size: 14px;" id="totalAmountDisplay">0.00</td>
                            <td></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let reportData = [];
let reportSummary = null;

// Initialize system config with theme
initPageWithTheme('openingstockreport.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        // User has permission via RoleMenuAccess
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
    }
});

// Get selected report type
function getReportType() {
    var radios = document.getElementsByName('reportType');
    for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) {
            return radios[i].value;
        }
    }
    return 'headerwise';
}

// Called when report type radio changes - update table headers
function onReportTypeChange() {
    var isItemwise = getReportType() === 'itemwise';
    var thead = document.querySelector('#reportTable thead tr');
    var tfoot = document.getElementById('reportTableFooter');
    
    if (isItemwise) {
        // Update headers for itemwise
        thead.innerHTML = `
            <th>Doc No</th>
            <th>Date</th>
            <th>Stock Code</th>
            <th>Stock Description</th>
            <th class="amount">Qty</th>
            <th>Unit</th>
            <th class="amount">Rate</th>
            <th class="amount">Amount</th>
        `;
        // Update footer for itemwise
        var footerRow = tfoot.querySelector('tr');
        footerRow.innerHTML = `
            <td colspan="4" style="text-align: right; padding: 12px 15px; font-size: 14px;">Total (<span id="totalCountSpan">0</span> Entries):</td>
            <td class="amount" style="padding: 12px 15px; font-size: 14px;" id="totalItemQtyDisplay">0.00</td>
            <td></td>
            <td></td>
            <td class="amount" style="padding: 12px 15px; font-size: 14px;" id="totalAmountDisplay">0.00</td>
        `;
    } else {
        // Update headers for headerwise
        thead.innerHTML = `
            <th>Doc No</th>
            <th>Date</th>
            <th>Narration</th>
            <th class="amount">Amount</th>
            <th>Posted By</th>
            <th>Posted Time</th>
        `;
        // Reset footer for headerwise
        var footerRow = tfoot.querySelector('tr');
        footerRow.innerHTML = `
            <td colspan="2" style="text-align: right; padding: 12px 15px; font-size: 14px;">Total (<span id="totalCountSpan">0</span> Entries):</td>
            <td></td>
            <td class="amount" style="padding: 12px 15px; font-size: 14px;" id="totalAmountDisplay">0.00</td>
            <td></td>
            <td></td>
        `;
    }
    
    // Re-fetch data with new report type if we have data
    if (reportData.length > 0) {
        loadReport();
    }
}

// Load report data
function loadReport() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('reportTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    
    var filters = {
        fromDate: document.getElementById('fromDate').value,
        toDate: document.getElementById('toDate').value,
        reportType: getReportType()
    };
    
    apiGetOpeningStockReport(filters, function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            reportData = response.openingStocks || [];
            reportSummary = response.summary || null;
            
            displayReport(reportData);
        } else {
            showMessage('Error loading report: ' + response.message, 'error');
            document.getElementById('emptyState').style.display = 'block';
        }
    });
}

// Display report in table
function displayReport(openingStocks) {
    const tbody = document.getElementById('reportTableBody');
    tbody.innerHTML = '';
    
    if (openingStocks.length === 0) {
        document.getElementById('reportTable').style.display = 'none';
        document.getElementById('reportTableFooter').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        return;
    }
    
    document.getElementById('reportTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    
    var isItemwise = getReportType() === 'itemwise';
    
    openingStocks.forEach(function(os) {
        if (isItemwise && os.details && os.details.length > 0) {
            // Itemwise: one row per item with header info repeated
            os.details.forEach(function(item) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${escapeHtml(os.docNo)}</strong></td>
                    <td>${formatDate(os.date)}</td>
                    <td>${escapeHtml(item.stockCode || '-')}</td>
                    <td>${escapeHtml(item.stockDescription || '-')}</td>
                    <td class="amount">${formatAmount(item.qty)}</td>
                    <td>${escapeHtml(item.unit || '-')}</td>
                    <td class="amount">${formatAmount(item.rate)}</td>
                    <td class="amount">${formatAmount(item.amount)}</td>
                `;
                tbody.appendChild(row);
            });
        } else {
            // Headerwise: one row per entry
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${escapeHtml(os.docNo)}</strong></td>
                <td>${formatDate(os.date)}</td>
                <td>${escapeHtml(os.narration || '-')}</td>
                <td class="amount">${formatAmount(os.amount)}</td>
                <td>${escapeHtml(os.postedBy || '-')}</td>
                <td>${escapeHtml(os.postedTime || '-')}</td>
            `;
            tbody.appendChild(row);
        }
    });
    
    // Show summary footer
    if (reportSummary) {
        document.getElementById('totalCountSpan').textContent = reportSummary.totalCount;
        document.getElementById('totalAmountDisplay').textContent = formatAmount(reportSummary.totalAmount);
        
        if (isItemwise && document.getElementById('totalItemQtyDisplay')) {
            document.getElementById('totalItemQtyDisplay').textContent = formatAmount(reportSummary.totalQty || 0);
        }
        
        document.getElementById('reportTableFooter').style.display = '';
    }
}

// Reset filters
function resetFilters() {
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
    
    // Hide results
    document.getElementById('reportTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').querySelector('p').textContent = 'Select filters and click "Generate Report" to view opening stock data.';
}

// Export to CSV
function exportToCSV() {
    if (!reportData || reportData.length === 0) {
        showMessage('No data to export. Please generate a report first.', 'warning');
        return;
    }
    
    var isItemwise = getReportType() === 'itemwise';
    var csv = '';
    
    if (isItemwise) {
        // Itemwise CSV headers
        csv = 'Doc No,Date,Stock Code,Stock Description,Qty,Unit,Rate,Amount\n';
        
        reportData.forEach(function(os) {
            if (os.details && os.details.length > 0) {
                os.details.forEach(function(item) {
                    csv += '"' + (os.docNo || '') + '",';
                    csv += '"' + (os.date || '') + '",';
                    csv += '"' + (item.stockCode || '') + '",';
                    csv += '"' + (item.stockDescription || '') + '",';
                    csv += (item.qty || 0) + ',';
                    csv += '"' + (item.unit || '') + '",';
                    csv += (item.rate || 0) + ',';
                    csv += (item.amount || 0) + '\n';
                });
            } else {
                // Opening stock with no details - still output header info
                csv += '"' + (os.docNo || '') + '",';
                csv += '"' + (os.date || '') + '",';
                csv += ',,,,,\n';
            }
        });
    } else {
        // Headerwise CSV
        csv = 'Doc No,Date,Narration,Amount,Posted By,Posted Time\n';
        
        reportData.forEach(function(os) {
            csv += '"' + (os.docNo || '') + '",';
            csv += '"' + (os.date || '') + '",';
            csv += '"' + (os.narration || '') + '",';
            csv += (os.amount || 0) + ',';
            csv += '"' + (os.postedBy || '') + '",';
            csv += '"' + (os.postedTime || '') + '"\n';
        });
    }
    
    // Add summary rows
    if (reportSummary) {
        csv += '\n';
        csv += 'SUMMARY\n';
        csv += 'Total Entries:,' + reportSummary.totalCount + '\n';
        csv += 'Total Amount:,' + reportSummary.totalAmount + '\n';
        if (isItemwise && reportSummary.totalQty) {
            csv += 'Total Item Qty:,' + reportSummary.totalQty + '\n';
        }
    }
    
    // Create download link
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    var url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', 'OpeningStock_Report_' + new Date().toISOString().slice(0, 10) + '.csv');
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    showMessage('Report exported successfully!', 'success');
}

// Logout function
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}
</script>

</body>
</html>
