<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard Master</title>
<link rel="stylesheet" href="design-system.css">

<!-- Styles migrated to design-system.css -->
</head>

<body>

<div class="container">
    <div class="header">
        <h1 class="pg-icon pg-icon--dashboard">Dashboard Master</h1>
        <div>
            <button class="btn" onclick="window.location.href='home.html'">🏠 Home</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="breadcrumbContainer" class="breadcrumb-container"></div>

    <div class="layout-with-sidebar">
        <div class="sidebar">
            <div id="companyNameSidebar" class="company-name-sidebar"></div>
            <h3>Navigation Menu</h3>
            <div id="menuContainer"></div>
        </div>

        <div class="main-content">
            <div id="messageContainer"></div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by Code or Description..." onkeyup="filterTable()">
                </div>
                <div>
                    <button class="btn btn-success" onclick="saveAllChanges()">💾 Save All Changes</button>
                    <button class="btn" onclick="loadDashboardData()">🔄 Refresh</button>
                </div>
            </div>

            <div class="table-container">
                <div id="loadingIndicator" class="loading">Loading dashboard data</div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📋</div>
                    <h3>No Dashboard Records Found</h3>
                    <p>Please add records to the Dashboard sheet in the Google Sheet.</p>
                </div>
                <table id="dashboardTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Description</th>
                            <th>Roles</th>
                            <th>Users</th>
                        </tr>
                    </thead>
                    <tbody id="dashboardTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="indexedDB.js"></script>
<script src="session.js"></script>
<script src="menu.js"></script>
<script src="systemConfig.js"></script>
<script src="ui.js"></script>
<script src="themeManager.js"></script>
<script>
// Global variables
let dashboardData = [];
let allRoles = [];
let allUsers = [];
let openDropdown = null;

// Initialize system config with theme
initPageWithTheme('dashboardmaster.htm', 'companyNameSidebar');

// Protect this page with menu-based access control
protectPageWithMenuAccess(function(isValid) {
    if (isValid) {
        renderMenu('menuContainer');
        renderBreadcrumb('breadcrumbContainer');
        
        // Load roles, users, and dashboard data
        loadReferenceData();
    }
});

// Load reference data (roles and users) then dashboard
function loadReferenceData() {
    // Load all roles
    apiGetRoles(function(response) {
        if (response.status === 'success') {
            allRoles = response.roles || [];
        }
        
        // Load all users
        apiGetUsers(function(response) {
            if (response.status === 'success') {
                allUsers = response.users || [];
            }
            
            // Now load dashboard data
            loadDashboardData();
        });
    });
}

// Parse XML string to array
function parseXmlToArray(xmlStr, tagName) {
    if (!xmlStr) return [];
    var results = [];
    var regex = new RegExp('<' + tagName + '>([^<]*)<\\/' + tagName + '>', 'gi');
    var match;
    while ((match = regex.exec(xmlStr)) !== null) {
        if (match[1].trim()) {
            results.push(match[1].trim());
        }
    }
    return results;
}

// Build XML string from array
function buildXmlFromArray(arr, tagName) {
    if (!arr || arr.length === 0) return '';
    return arr.map(function(item) { return '<' + tagName + '>' + item + '</' + tagName + '>'; }).join('');
}

// Get role name by role ID
function getRoleNameById(roleId) {
    if (!roleId || !allRoles || allRoles.length === 0) return roleId;
    for (var i = 0; i < allRoles.length; i++) {
        if (String(allRoles[i].roleId) === String(roleId)) {
            return allRoles[i].roleName || roleId;
        }
    }
    return roleId;
}

// Get user name by login ID
function getUserNameById(loginId) {
    if (!loginId || !allUsers || allUsers.length === 0) return loginId;
    for (var i = 0; i < allUsers.length; i++) {
        if (String(allUsers[i].loginId) === String(loginId)) {
            return allUsers[i].userName || loginId;
        }
    }
    return loginId;
}

// Load dashboard data
function loadDashboardData() {

    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('dashboardTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    
    apiGetDashboard(function(response) {
        document.getElementById('loadingIndicator').style.display = 'none';
        
        if (response.status === 'success') {
            dashboardData = response.dashboard || [];
            
            if (dashboardData.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
            
            document.getElementById('dashboardTable').style.display = 'table';
            renderTable();
        } else {
            showMessage('Error loading dashboard data: ' + response.message, 'error');
            document.getElementById('emptyState').style.display = 'block';
        }
    });
}

// Render table
function renderTable() {
    var tbody = document.getElementById('dashboardTableBody');
    tbody.innerHTML = '';
    
    dashboardData.forEach(function(item, index) {
        var row = document.createElement('tr');
        row.setAttribute('data-index', index);
        
        var roles = parseXmlToArray(item.roles, 'role');
        var users = parseXmlToArray(item.users, 'user');
        
        row.innerHTML = `
            <td><strong>${escapeHtml(item.code)}</strong></td>
            <td>${escapeHtml(item.description)}</td>
            <td>
                <div class="multi-select-container" data-field="roles" data-index="${index}">
                    <div class="multi-select-display" onclick="toggleDropdown(this)">
                        <span class="multi-select-placeholder" style="${roles.length > 0 ? 'display:none;' : ''}">Select roles...</span>
                        ${roles.map(function(r) { 
                            var roleName = getRoleNameById(r);
                            return '<span class="multi-select-tag" data-value="' + escapeHtml(r) + '">' + escapeHtml(roleName || r) + '<span class="remove-tag" onclick="event.stopPropagation(); removeTag(this, \'' + index + '\', \'roles\', \'' + escapeHtml(r) + '\')">&times;</span></span>';
                        }).join('')}
                    </div>
                    <div class="multi-select-dropdown">
                        ${allRoles.map(function(role) {
                            var checked = roles.indexOf(String(role.roleId || role.roleName)) !== -1 ? 'checked' : '';
                            return '<div class="multi-select-option"><input type="checkbox" value="' + escapeHtml(role.roleId || role.roleName) + '" ' + checked + ' onchange="onCheckboxChange(this, \'' + index + '\', \'roles\')"><label>' + escapeHtml(role.roleName || role.roleId) + '</label></div>';
                        }).join('')}
                    </div>
                </div>
            </td>
            <td>
                <div class="multi-select-container" data-field="users" data-index="${index}">
                    <div class="multi-select-display" onclick="toggleDropdown(this)">
                        <span class="multi-select-placeholder" style="${users.length > 0 ? 'display:none;' : ''}">Select users...</span>
                        ${users.map(function(u) { 
                            var userName = getUserNameById(u);
                            return '<span class="multi-select-tag" data-value="' + escapeHtml(u) + '">' + escapeHtml(userName || u) + '<span class="remove-tag" onclick="event.stopPropagation(); removeTag(this, \'' + index + '\', \'users\', \'' + escapeHtml(u) + '\')">&times;</span></span>';
                        }).join('')}
                    </div>
                    <div class="multi-select-dropdown">
                        ${allUsers.map(function(user) {
                            var loginId = user.loginId || user.userId || '';
                            var userName = user.userName || loginId;
                            var checked = users.indexOf(String(loginId)) !== -1 ? 'checked' : '';
                            return '<div class="multi-select-option"><input type="checkbox" value="' + escapeHtml(loginId) + '" ' + checked + ' onchange="onCheckboxChange(this, \'' + index + '\', \'users\')"><label>' + escapeHtml(userName) + '</label></div>';
                        }).join('')}
                    </div>
                </div>
            </td>
        `;
        tbody.appendChild(row);
    });
}

// Toggle dropdown
function toggleDropdown(displayElement) {
    var container = displayElement.closest('.multi-select-container');
    var dropdown = container.querySelector('.multi-select-dropdown');
    
    // Close any other open dropdown
    if (openDropdown && openDropdown !== dropdown) {
        openDropdown.classList.remove('open');
    }
    
    dropdown.classList.toggle('open');
    openDropdown = dropdown.classList.contains('open') ? dropdown : null;
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    if (!e.target.closest('.multi-select-container')) {
        if (openDropdown) {
            openDropdown.classList.remove('open');
            openDropdown = null;
        }
    }
});

// Handle checkbox change
function onCheckboxChange(checkbox, index, field) {
    var container = checkbox.closest('.multi-select-container');
    var display = container.querySelector('.multi-select-display');
    var placeholder = display.querySelector('.multi-select-placeholder');
    var value = checkbox.value;
    
    if (checkbox.checked) {
        // Add tag - show name for roles, ID for users
        var displayName = value;
        if (field === 'roles') {
            displayName = getRoleNameById(value) || value;
        } else if (field === 'users') {
            displayName = getUserNameById(value) || value;
        }
        var tag = document.createElement('span');
        tag.className = 'multi-select-tag';
        tag.setAttribute('data-value', value);
        tag.innerHTML = escapeHtml(displayName) + '<span class="remove-tag" onclick="event.stopPropagation(); removeTag(this, \'' + index + '\', \'' + field + '\', \'' + escapeHtml(value) + '\')">&times;</span>';
        display.insertBefore(tag, placeholder);
    } else {
        // Remove tag
        var tag = display.querySelector('.multi-select-tag[data-value="' + value.replace(/"/g, '\\"') + '"]');
        if (tag) tag.remove();
    }
    
    // Toggle placeholder
    var tags = display.querySelectorAll('.multi-select-tag');
    placeholder.style.display = tags.length > 0 ? 'none' : '';
    
    // Update data model
    updateDataModel(index, field);
}

// Remove tag
function removeTag(element, index, field, value) {
    var tag = element.closest('.multi-select-tag');
    tag.remove();
    
    // Uncheck the corresponding checkbox
    var container = tag.closest('.multi-select-container');
    var checkbox = container.querySelector('.multi-select-dropdown input[value="' + value.replace(/"/g, '\\"') + '"]');
    if (checkbox) checkbox.checked = false;
    
    // Toggle placeholder
    var display = container.querySelector('.multi-select-display');
    var placeholder = display.querySelector('.multi-select-placeholder');
    var tags = display.querySelectorAll('.multi-select-tag');
    placeholder.style.display = tags.length > 0 ? 'none' : '';
    
    // Update data model
    updateDataModel(index, field);
}

// Update data model from UI
function updateDataModel(index, field) {
    var row = document.querySelector('#dashboardTableBody tr[data-index="' + index + '"]');
    if (!row) return;
    
    var container = row.querySelector('.multi-select-container[data-field="' + field + '"]');
    if (!container) return;
    
    var tags = container.querySelectorAll('.multi-select-tag');
    var values = [];
    tags.forEach(function(tag) {
        values.push(tag.getAttribute('data-value'));
    });
    
    // Update the data model
    if (dashboardData[index]) {
        dashboardData[index][field] = buildXmlFromArray(values, field === 'roles' ? 'role' : 'user');
    }
}

// Save all changes
function saveAllChanges() {
    // First, sync all data from UI to model
    var rows = document.querySelectorAll('#dashboardTableBody tr');
    rows.forEach(function(row) {
        var index = row.getAttribute('data-index');
        if (index !== null) {
            updateDataModel(parseInt(index), 'roles');
            updateDataModel(parseInt(index), 'users');
        }
    });
    
    // Check if there are any changes
    var hasChanges = false;
    dashboardData.forEach(function(item) {
        if (item._changed) hasChanges = true;
    });
    
    // Save each item
    var savedCount = 0;
    var errorCount = 0;
    var totalToSave = dashboardData.length;
    
    if (totalToSave === 0) {
        showMessage('No data to save.', 'warning');
        return;
    }
    
    showMessage('Saving ' + totalToSave + ' record(s)...', 'success');
    
    dashboardData.forEach(function(item, index) {
        apiUpdateDashboard({
            code: item.code,
            description: item.description,
            roles: item.roles || '',
            users: item.users || ''
        }, function(response) {
            if (response.status === 'success') {
                savedCount++;
            } else {
                errorCount++;
            }
            
            // Check if all saves are complete
            if (savedCount + errorCount === totalToSave) {
                if (errorCount === 0) {
                    showMessage('All ' + savedCount + ' record(s) saved successfully!', 'success');
                } else {
                    showMessage(savedCount + ' saved, ' + errorCount + ' failed.', errorCount > 0 ? 'warning' : 'success');
                }
                loadDashboardData();
            }
        });
    });
}

// Filter table
function filterTable() {
    var search = document.getElementById('searchInput').value.toLowerCase();
    var rows = document.querySelectorAll('#dashboardTableBody tr');
    
    rows.forEach(function(row) {
        var text = row.textContent.toLowerCase();
        row.style.display = text.indexOf(search) > -1 ? '' : 'none';
    });
}

// Show message

// Escape HTML

// Logout
function logout() {
    if (confirm('Are you sure you want to logout?')) {
        performLogout();
    }
}
</script>

</body>
</html>
